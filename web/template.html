<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>夜の言葉</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f3ec;--card:#fff;--ink:#241f1a;--muted:#7a7368;--accent:#8a6d3b;--soft:#efe6d2;--border:#e0dacb;--rt:#8c8171;
--mark:#f3ecdc;--mark-line:#cdb07a;--bad:#b5534a;--bad-soft:#f6e3df;--ok-soft:#e1f0e6;
--c0:#4a6fa5;--c1:#b5655a;--c2:#5f8a4e;--c3:#8a5fa0;--c4:#b0802f;--c5:#3f8f93;--c6:#a8577e;--c7:#6b6f7c;--ok:#3f8a5f;
--jp:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;--nav-h:58px;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#12172b;--card:#1c2340;--ink:#e8e6f0;--muted:#8b92b8;--accent:#d4b876;--soft:#262e52;--border:#2a3155;--rt:#9aa0c2;--mark:#2c3358;--mark-line:#9c8656;--bad:#e08a80;--bad-soft:#3a2634;--ok-soft:#1f3a33;--c0:#7fa3d9;--c1:#e0928a;--c2:#94c084;--c3:#bf97d6;--c4:#e0b466;--c5:#79c4c7;--c6:#df8fb6;--c7:#a4a9b8;--ok:#6cc596;}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#12172b;--card:#1c2340;--ink:#e8e6f0;--muted:#8b92b8;--accent:#d4b876;--soft:#262e52;--border:#2a3155;--rt:#9aa0c2;--mark:#2c3358;--mark-line:#9c8656;--bad:#e08a80;--bad-soft:#3a2634;--ok-soft:#1f3a33;--c0:#7fa3d9;--c1:#e0928a;--c2:#94c084;--c3:#bf97d6;--c4:#e0b466;--c5:#79c4c7;--c6:#df8fb6;--c7:#a4a9b8;--ok:#6cc596;}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;-webkit-text-size-adjust:100%;}
[hidden]{display:none!important;}
button{font:inherit;color:inherit;}
a{color:var(--accent);}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:20px 40px;}

/* ---------- 顶部 ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;}
.logo{font-family:var(--jp);font-size:1.6rem;font-weight:700;letter-spacing:.06em;line-height:1.2;}
.brand{min-width:0;}
.tagline{color:var(--muted);font-size:.8rem;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.topr{display:flex;align-items:center;gap:8px;min-width:0;}
.themebtn{width:36px;height:36px;flex:none;border:1px solid var(--border);background:var(--card);border-radius:50%;cursor:pointer;display:grid;place-items:center;color:var(--accent);padding:0;}
.themebtn svg{width:18px;height:18px;}
.acct{display:flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--card);border-radius:999px;padding:4px 12px 4px 4px;cursor:pointer;font-size:.8rem;flex:none;}
.acct img{width:26px;height:26px;border-radius:50%;flex:none;}
.acct .ph{width:26px;height:26px;border-radius:50%;flex:none;background:var(--soft);display:grid;place-items:center;font-size:.8rem;color:var(--accent);}
.acct .an{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:28vw;}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none;}
.dot.on{background:var(--ok);}

/* ---------- 导航 ---------- */
.tabs{display:flex;gap:6px;margin-bottom:12px;}
.tab{flex:1;padding:9px 4px;border-radius:10px;border:1px solid var(--border);background:var(--card);font-size:.92rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;}
.tab .ic{font-family:var(--jp);font-weight:700;opacity:.8;}
.tab.active{background:var(--accent);color:var(--card);border-color:var(--accent);}

/* ---------- 筛选 / 搜索 ---------- */
.filters{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:10px;}
.fhead{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;background:none;border:0;cursor:pointer;text-align:left;}
.ftitle{font-weight:600;font-size:.85rem;flex:none;}
.fsum{flex:1;min-width:0;font-size:.78rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.chev{flex:none;width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:-4px 4px 0;transition:transform .2s;}
.filters.open .chev{transform:rotate(-135deg);margin-top:4px;}
.fbody{padding:0 12px 10px;border-top:1px dashed var(--border);}
.frow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:8px 0 0;}
.flabel{font-size:.75rem;color:var(--muted);width:100%;}
.chip{border:1px solid var(--border);background:transparent;padding:5px 11px;border-radius:999px;font-size:.8rem;cursor:pointer;}
.chip.on{background:var(--soft);border-color:var(--accent);font-weight:600;}
.chip:disabled{opacity:.4;cursor:not-allowed;}
.stat{font-size:.76rem;color:var(--muted);padding:0 12px 10px;}
.search{position:relative;margin-bottom:12px;}
.search input{width:100%;padding:10px 36px 10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:.92rem;}
.search button{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);font-size:1.2rem;padding:4px 8px;cursor:pointer;}

/* ---------- 通用 ---------- */
.badge{display:inline-flex;align-items:center;font-size:.72rem;padding:2px 8px;border-radius:999px;border:1px solid;white-space:nowrap;background:none;cursor:pointer;}
.bw{color:var(--muted);border-color:var(--border);}
.bw.learned{color:var(--ok);border-color:var(--ok);}
.tier{font-size:.72rem;padding:2px 9px;border-radius:999px;background:var(--soft);color:var(--accent);}
.tags{display:flex;flex-wrap:wrap;gap:5px;}
.empty{color:var(--muted);text-align:center;padding:30px 0;font-size:.9rem;line-height:1.7;}
.btn{border:1px solid var(--border);background:var(--card);padding:9px 14px;border-radius:10px;cursor:pointer;font-size:.9rem;}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--card);}
.btn:disabled{opacity:.5;cursor:default;}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px;box-shadow:inset 0 -2px 0 var(--mark-line);}
.spk{border:0;background:none;color:var(--accent);cursor:pointer;padding:4px;border-radius:6px;line-height:0;flex:none;}
.spk svg{width:18px;height:18px;}
.no-tts .spk{display:none;}
.h2{font-size:.85rem;font-weight:600;color:var(--muted);margin:20px 0 6px;}
.sub{color:var(--muted);font-size:.8rem;line-height:1.5;margin:0 0 6px;}

/* 假名网格：每个音节上面是假名、下面是罗马音 */
.kg{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:2px 4px;}
.kc{display:flex;flex-direction:column;align-items:center;min-width:1.5em;}
.kc .kk{font-size:1rem;color:var(--muted);}
.kc .kr{font-size:.78rem;color:var(--accent);}
.kgsep{color:var(--muted);padding:0 6px;align-self:center;}
.syl{color:var(--accent);font-size:.8rem;letter-spacing:.02em;}

/* 歌词行：分段，汉字注假名，每段下标罗马音 */
.ll{padding:8px 0 8px 10px;border-left:2px solid var(--soft);}
.ll+.ll{margin-top:6px;}
.lj{display:flex;flex-wrap:wrap;align-items:flex-end;column-gap:.45em;row-gap:6px;}
.seg{display:inline-flex;flex-direction:column;align-items:flex-start;}
.sj{font-family:var(--jp);font-size:1.02rem;line-height:1.25;white-space:nowrap;}
.sr{font-size:.72rem;color:var(--muted);line-height:1.3;white-space:nowrap;}
.sr.hit{color:var(--accent);font-weight:600;}
.seg.gap{width:.6em;}
.seg.cs,.tkc{flex-direction:row;align-items:flex-end;gap:.12em;}
.tkc{display:inline-flex;}
.cu{display:inline-flex;flex-direction:column;align-items:center;}
.tk{cursor:pointer;border-radius:3px;}
.tk:hover{background:var(--soft);}
.blank{display:inline-block;min-width:2.6em;border-bottom:2px solid var(--accent);color:var(--accent);text-align:center;}
ruby{ruby-position:over;ruby-align:center;}
rt{font-size:.55em;color:var(--rt);font-family:-apple-system,"PingFang SC",sans-serif;letter-spacing:0;}
.lf{display:flex;align-items:center;gap:8px;margin-top:4px;}
.lt{font-size:.7rem;color:var(--muted);font-variant-numeric:tabular-nums;flex:none;}
.lz{color:var(--muted);font-size:.8rem;line-height:1.5;flex:1;min-width:0;}
.no-rt rt{visibility:hidden;}
.no-ro .sr{display:none;}
.no-zh .lz{visibility:hidden;}
.no-ro .lj{column-gap:.2em;}
.src{font-size:.78rem;color:var(--muted);margin-top:6px;}
.src b{color:var(--ink);font-weight:600;}

/* 展开的"出现在哪些歌" */
details.occ{width:100%;text-align:left;font-size:.85rem;margin-top:4px;}
details.occ>summary{cursor:pointer;color:var(--accent);padding:6px 0;}
.more{border:1px solid var(--border);background:var(--card);color:var(--accent);border-radius:999px;padding:5px 12px;font-size:.8rem;cursor:pointer;margin-top:8px;}
.occfoot{display:flex;gap:8px;flex-wrap:wrap;padding-top:4px;border-top:1px dashed var(--border);}
.ctxsong{padding:10px 0 12px;border-top:1px dashed var(--border);}
.ctxhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px;}
.ctxt{font-family:var(--jp);font-size:1.05rem;font-weight:700;}
.ctxa{font-size:.82rem;color:var(--muted);margin-top:1px;}
.gcount{font-size:.78rem;color:var(--muted);white-space:nowrap;}

/* ---------- 闪卡 ---------- */
.modes{display:flex;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:3px;margin-bottom:10px;}
.mode{flex:1;border:0;background:none;padding:7px 4px;border-radius:8px;cursor:pointer;font-size:.88rem;color:var(--muted);}
.mode.on{background:var(--soft);color:var(--ink);font-weight:600;}
.rvinfo{font-size:.8rem;color:var(--muted);margin:0 2px 10px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;}
.stage{perspective:1400px;margin-bottom:12px;touch-action:pan-y;}
.card{display:grid;cursor:pointer;transform-style:preserve-3d;transition:transform .45s;}
.card.flipped{transform:rotateY(180deg);}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid var(--border);border-radius:16px;background:var(--card);padding:22px 18px;min-height:320px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;}
.back{transform:rotateY(180deg);justify-content:flex-start;}
.bigword{font-family:var(--jp);font-size:2.4rem;font-weight:700;line-height:1.25;text-wrap:balance;}
.wordrow{display:flex;align-items:center;gap:6px;}
.hint{font-size:.78rem;color:var(--muted);}
.meaning{font-size:1.35rem;font-weight:600;text-wrap:balance;}
.wordline{font-family:var(--jp);font-size:1.05rem;}
.exbox{background:var(--soft);border-radius:12px;padding:10px 12px 12px;width:100%;text-align:left;}
.exbox .ll{border-left:0;padding-left:0;}
.exlabel{font-size:.72rem;color:var(--muted);letter-spacing:.08em;margin-bottom:2px;}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.prog{color:var(--muted);font-size:.84rem;font-variant-numeric:tabular-nums;}
.learn{margin-top:10px;width:100%;padding:11px;border-radius:10px;border:1px solid var(--accent);background:var(--soft);cursor:pointer;font-size:.92rem;}
.learn.on{background:var(--accent);color:var(--card);}
.tools{display:flex;gap:8px;margin-top:8px;}
.tools .btn{flex:1;font-size:.84rem;padding:8px;}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.grade{border:1px solid var(--border);background:var(--card);border-radius:10px;padding:9px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.95rem;}
.grade small{font-size:.72rem;color:var(--muted);}
.grade.g0{border-color:var(--bad);}
.grade.g2{border-color:var(--ok);}
.showans{width:100%;padding:12px;}

/* ---------- 测验 ---------- */
.quiz{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;}
.qtypes{display:flex;flex-wrap:wrap;gap:6px;}
.qprompt{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0;}
.qprompt .ll{text-align:left;border-left:0;width:100%;}
.qask{font-size:.8rem;color:var(--muted);}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.opt{border:1px solid var(--border);background:var(--bg);border-radius:10px;padding:12px 10px;cursor:pointer;text-align:left;font-size:.95rem;line-height:1.4;}
.opt .ok{display:block;font-size:.75rem;color:var(--muted);}
.opt.jp{font-family:var(--jp);font-size:1.1rem;}
.opt.right{border-color:var(--ok);background:var(--ok-soft);}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);}
.qfeed{font-size:.9rem;}
.qfeed.good{color:var(--ok);}
.qfeed.badf{color:var(--bad);}
.qscore{display:flex;justify-content:space-between;align-items:center;font-size:.82rem;color:var(--muted);}

/* ---------- 词表 / 语法 ---------- */
.group{font-size:.82rem;color:var(--muted);margin:18px 0 4px;font-weight:600;}
.row{border-bottom:1px solid var(--border);}
.rowhead{display:flex;align-items:center;gap:10px;padding:11px 2px;cursor:pointer;}
.rowhead input{width:20px;height:20px;flex:none;accent-color:var(--accent);}
.rw{font-family:var(--jp);font-size:1.15rem;font-weight:700;min-width:6em;max-width:45%;}
.rw .syl{display:block;font-family:-apple-system,"PingFang SC",sans-serif;font-weight:400;}
.rm{flex:1;font-size:.9rem;min-width:0;}
.rc{font-size:.75rem;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;}
.rowbody{display:none;padding:0 4px 14px 32px;}
.row.open .rowbody{display:flex;flex-direction:column;gap:10px;}
.gram .rowbody{padding-left:4px;}
.done .rw,.done .rm{opacity:.5;}

/* ---------- 歌曲 ---------- */
.rec{display:grid;gap:10px;margin-bottom:6px;}
.reccard{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;}
.rectop{display:flex;justify-content:space-between;gap:10px;align-items:baseline;}
.rect{font-family:var(--jp);font-size:1.08rem;font-weight:700;}
.reca{font-size:.78rem;color:var(--muted);}
.meter{height:6px;border-radius:3px;background:var(--soft);overflow:hidden;display:flex;}
.meter i{display:block;height:100%;background:var(--accent);}
.meter i+i{background:var(--mark-line);opacity:.6;border-left:2px solid var(--card);}
.recnote{font-size:.8rem;color:var(--muted);}
.album{background:var(--card);border:1px solid var(--border);border-radius:14px;margin-bottom:12px;overflow:hidden;}
.ahead{display:flex;gap:14px;align-items:center;width:100%;padding:12px;}
.ahead .cover{width:112px;height:112px;}
.anote{font-size:.82rem;color:var(--muted);line-height:1.6;margin:0;padding:0 12px 12px;}
.aback{border:0;background:none;color:var(--accent);font-size:.9rem;cursor:pointer;padding:6px 0;margin-bottom:6px;}
.shelfband{font-size:.8rem;color:var(--muted);margin:14px 0 8px;}
.shelf{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.tile{border:0;padding:0;background:none;cursor:pointer;display:flex;flex-direction:column;gap:5px;min-width:0;color:var(--ink);}
.tcover{position:relative;display:block;border-radius:10px;overflow:hidden;box-shadow:0 1px 3px rgba(10,12,20,.12);}
.tname{font-family:var(--jp);font-size:.8rem;line-height:1.3;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tile .cover{width:100%;height:auto;aspect-ratio:1;border-radius:0;display:grid;}
.tile:hover .cover{filter:brightness(1.06);}
.tbar{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(0,0,0,.28);}
.tbar i{display:block;height:100%;background:var(--accent);}
.cover{width:76px;height:76px;border-radius:8px;flex:none;object-fit:cover;background:var(--soft);display:grid;place-items:center;font-family:var(--jp);font-weight:700;color:var(--accent);font-size:.9rem;text-align:center;padding:4px;}
img.cover{padding:0;}
.ainfo{flex:1;min-width:0;}
.at{font-family:var(--jp);font-size:1.12rem;font-weight:700;line-height:1.35;}
.az{font-size:.82rem;color:var(--muted);}
.am{font-size:.76rem;color:var(--muted);margin-top:4px;line-height:1.5;}
.abody{padding:0 12px 6px;border-top:1px dashed var(--border);}
.song .rw{min-width:0;max-width:none;flex:1;}
.song .rw .sz{display:block;font-family:-apple-system,"PingFang SC",sans-serif;font-weight:400;font-size:.8rem;color:var(--muted);}
.song .rowbody{padding-left:2px;}
.listen{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.82rem;align-items:center;}
.listen span{color:var(--muted);}
details.lyr>summary{cursor:pointer;color:var(--accent);padding:6px 0;font-size:.85rem;}
.lyrics .ll{margin-top:10px;}
.dupnote{font-size:.76rem;color:var(--muted);}
.pending{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:12px;margin-top:8px;}
.pend{display:flex;flex-direction:column;gap:4px;font-size:.75rem;color:var(--muted);text-align:center;}
.pend .cover{width:100%;height:auto;aspect-ratio:1;max-width:100%;opacity:.55;filter:grayscale(.5);}
.lmatch{margin-top:10px;}
.lmatch .src{margin:0 0 2px;}

/* ---------- 关系图 ---------- */
.gkinds{margin-bottom:8px;}
.gwrap{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;}
.graph{display:block;width:100%;height:auto;}
.ge{stroke:var(--accent);stroke-opacity:.35;stroke-linecap:round;}
.gx{stroke:var(--muted);stroke-opacity:.25;stroke-dasharray:3 4;}
.gn{cursor:pointer;outline:none;}
.gn circle{fill:var(--card);stroke:var(--accent);stroke-width:1.6;}
.gn.gl circle{fill:var(--ok-soft);stroke:var(--ok);}
.gn.gc circle{fill:var(--accent);stroke:var(--accent);}
.gn:hover circle,.gn:focus-visible circle{stroke-width:3;}
.gt{font-family:var(--jp);font-size:13px;fill:var(--ink);paint-order:stroke;stroke:var(--card);stroke-width:3px;stroke-linejoin:round;}
.gc .gt{font-size:17px;font-weight:700;}
.gm{font-size:11px;fill:var(--muted);paint-order:stroke;stroke:var(--card);stroke-width:3px;}
.gtrail{font-size:.78rem;color:var(--muted);align-self:center;}
#v-graph .sub{margin-top:8px;}

/* ---------- 弹出词卡 / 提示 ---------- */
.pop{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(520px,calc(100% - 24px));max-height:70vh;overflow:auto;background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:0 10px 32px rgba(10,12,20,.22);padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;}
.pophead{display:flex;align-items:center;gap:8px;}
.popword{font-family:var(--jp);font-size:1.6rem;font-weight:700;}
.popword rt{font-size:.45em;}
.popx{margin-left:auto;border:0;background:none;font-size:1.3rem;color:var(--muted);cursor:pointer;padding:2px 8px;}
.popmeta{font-size:.82rem;color:var(--muted);}
.popbox{background:var(--soft);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;}
.popm{font-size:1.05rem;font-weight:600;}
.popacts{display:flex;gap:8px;flex-wrap:wrap;}
.popacts .btn{padding:7px 12px;font-size:.84rem;}
.gl{font-size:.88rem;line-height:1.6;}
.toast{position:fixed;z-index:40;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:.84rem;max-width:calc(100% - 32px);text-align:center;line-height:1.5;}

/* ---------- 我的（设置面板） ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,12,20,.4);z-index:20;}
.sheet{position:fixed;z-index:21;left:50%;bottom:0;transform:translateX(-50%);width:min(560px,100%);max-height:88vh;overflow:auto;background:var(--card);border:1px solid var(--border);border-radius:16px 16px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));}
.sheet h3{margin:0 0 10px;font-size:1rem;}
.sheet section{padding:14px 0;border-top:1px solid var(--border);}
.sheet section:first-of-type{border-top:0;padding-top:0;}
.sheet p{font-size:.84rem;color:var(--muted);line-height:1.6;margin:0 0 8px;}
.who{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.who img{width:36px;height:36px;border-radius:50%;}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;font-size:.9rem;}
.toggle input{width:20px;height:20px;accent-color:var(--accent);flex:none;}
.toggle.off{opacity:.45;}
.optrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;font-size:.9rem;flex-wrap:wrap;}
.sheet textarea{width:100%;min-height:84px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--ink);padding:8px;font:inherit;font-size:.78rem;}
.srow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
.msg{font-size:.8rem;color:var(--ok);margin-top:6px;min-height:1em;}
.msg.err{color:var(--bad);}
.authf{display:flex;flex-direction:column;gap:6px;margin-top:4px;}
.authf label{font-size:.8rem;color:var(--muted);}
.authf input{padding:10px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:.95rem;}
.authf .srow{align-items:center;}
#nickForm .srow{margin-top:0;flex-wrap:nowrap;}
#nickForm input{flex:1;min-width:0;}
#authOauth{margin-top:4px;}
#authOut{margin-top:8px;}
.linkbtn{border:0;background:none;color:var(--accent);cursor:pointer;padding:8px 4px;font-size:.84rem;text-decoration:underline;}
.who .ph{width:36px;height:36px;border-radius:50%;background:var(--soft);display:grid;place-items:center;color:var(--accent);font-weight:600;}
.close{position:absolute;right:12px;top:10px;border:0;background:none;font-size:1.4rem;cursor:pointer;color:var(--muted);padding:4px 8px;}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px;}
.kpi{background:var(--bg);border-radius:10px;padding:8px 10px;}
.kpi b{display:block;font-size:1.35rem;font-weight:600;line-height:1.2;}
.kpi span{font-size:.72rem;color:var(--muted);}
.chart{position:relative;}
.ctitle{font-size:.8rem;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between;}
.bars{display:flex;align-items:flex-end;height:96px;border-bottom:1px solid var(--border);gap:2px;}
.bcol{flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center;cursor:pointer;border:0;background:none;padding:0;}
.bcol i{display:block;width:min(20px,70%);background:var(--accent);border-radius:4px 4px 0 0;min-height:0;}
.bcol.sel i,.bcol:hover i{background:var(--mark-line);}
.xax{display:flex;justify-content:space-between;font-size:.7rem;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums;}
.readout{font-size:.8rem;margin-top:6px;min-height:1.2em;}

/* ---------- 播放器：「我的」里的设置 + 底部播放条 ---------- */
.plsum{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:.84rem;margin-bottom:4px;}
.plsum b{font-weight:500;word-break:break-all;}
.plsum .okd{color:var(--ok);}
.plsum .bad{color:var(--bad);}
.vip{font-size:.72rem;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:0 6px;margin-left:4px;}
.qrbox{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--bg);border-radius:12px;padding:12px;margin-top:8px;text-align:center;}
.qrbox img{width:180px;height:180px;background:#fff;border-radius:8px;padding:6px;}
.qrbox p{margin:0;}
#plSms .srow{margin-top:0;flex-wrap:nowrap;}
#plSms input{flex:1;min-width:0;}
.pbar{position:fixed;z-index:18;left:50%;transform:translateX(-50%);bottom:var(--pbb,0px);width:min(760px,100%);background:var(--card);border:1px solid var(--border);border-bottom:0;border-radius:16px 16px 0 0;box-shadow:0 -6px 24px rgba(10,12,20,.12);padding:10px 14px calc(8px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:4px;}
.pb1,.pb2{display:flex;align-items:center;gap:8px;min-width:0;}
.pcov{width:44px;height:44px;border-radius:8px;flex:none;object-fit:cover;background:var(--soft);cursor:pointer;}
.pinfo{flex:1;min-width:0;}
.ptitle{border:0;background:none;padding:0;color:var(--muted);font-size:.76rem;cursor:pointer;display:flex;gap:8px;width:100%;text-align:left;}
.ptitle span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
.ptitle span+span{margin-left:auto;flex:none;font-variant-numeric:tabular-nums;}
.pline{font-family:var(--jp);font-size:1rem;line-height:1.7;max-height:3.4em;overflow:hidden;}
.pline .tk{padding:0 1px;}
.pzh{font-size:.78rem;color:var(--muted);line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.no-zh .pzh{display:none;}
.pbtn{border:0;background:none;color:var(--ink);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:none;padding:0;}
.pbtn svg{width:20px;height:20px;}
.pbtn:disabled{opacity:.35;cursor:default;}
.pbtn[aria-pressed="true"]{color:var(--accent);background:var(--soft);}
.pbtn.pplay{width:44px;height:44px;background:var(--accent);color:var(--card);}
.pbtn.pplay svg{width:22px;height:22px;}
.pseek{flex:1;min-width:0;accent-color:var(--accent);margin:0;}
.pmsg{font-size:.76rem;color:var(--muted);line-height:1.4;}
.pmsg.err{color:var(--bad);}
body.pb .wrap{padding-bottom:calc(var(--pbb,0px) + var(--pbh,120px) + 28px);}
body.pb .pop{bottom:calc(var(--pbb,0px) + var(--pbh,120px) + 10px);max-height:calc(100vh - var(--pbb,0px) - var(--pbh,120px) - 40px);}
body.pb .toast{bottom:calc(var(--pbb,0px) + var(--pbh,120px) + 12px);}
.ll.cur{border-left-color:var(--accent);background:var(--mark);border-radius:0 8px 8px 0;}
.lplay{border:0;background:var(--soft);color:var(--accent);border-radius:999px;padding:2px 8px;cursor:pointer;font-size:.7rem;font-variant-numeric:tabular-nums;flex:none;}
.lplay:hover{background:var(--mark);}
.plbtn{padding:6px 12px;font-size:.84rem;}
.ainfo .plbtn{margin-top:8px;}
.row.song.playing .rw::before{content:"♪ ";color:var(--accent);}

/* ---------- 页脚 ---------- */
footer{margin-top:36px;padding-top:14px;border-top:1px solid var(--border);color:var(--muted);font-size:.78rem;line-height:1.7;}
footer p{margin:0 0 6px;}

/* ---------- 手机 ---------- */
@media (max-width:640px){
  .wrap{padding-block:14px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px));}
  .logo{font-size:1.35rem;}
  .tabs{position:fixed;z-index:10;left:0;right:0;bottom:0;margin:0;gap:0;background:var(--card);border-top:1px solid var(--border);padding:4px 6px calc(4px + env(safe-area-inset-bottom,0px));}
  .tab{flex-direction:column;gap:1px;border:0;border-radius:10px;padding:6px 2px;font-size:.72rem;background:none;color:var(--muted);}
  .tab .ic{font-size:1.1rem;opacity:1;}
  .tab.active{background:none;color:var(--accent);}
  .face{min-height:300px;padding:18px 14px;}
  .bigword{font-size:2.1rem;}
  .rowbody{padding-left:4px;}
  .rw{min-width:5em;}
  .cover{width:64px;height:64px;}
  .ahead .cover{width:96px;height:96px;}
  .shelf{gap:8px;}
  .opts{grid-template-columns:1fr;}
  .kpis{grid-template-columns:repeat(2,1fr);}
  .pop,.toast{bottom:calc(var(--nav-h) + 12px + env(safe-area-inset-bottom,0px));}
  .pbar{padding-bottom:8px;border-radius:14px 14px 0 0;box-shadow:0 -4px 16px rgba(10,12,20,.1);}
}
@media (prefers-reduced-motion:reduce){.card,.chev{transition:none;}}

<script>
const DATA = __DATA__;
const SITE = __SITE__;

// ================= 基础数据 =================
const albumById=Object.fromEntries(DATA.albums.map(a=>[a.id,a]));
const albumColor=Object.fromEntries(DATA.albums.map((a,i)=>[a.id,"var(--c"+(i%8)+")"]));
const songById=Object.fromEntries(DATA.songs.map(s=>[s.id,s]));
const bandById=Object.fromEntries(DATA.bands.map(b=>[b.id,b]));
const vocabByW=Object.fromEntries(DATA.vocab.map(v=>[v.w,v]));
// 乐队按 catalog.json 里第一张专辑出现的先后排序；还没有专辑的乐队排在最后
const bandRank=id=>{const i=DATA.albums.findIndex(a=>a.artist===id);return i<0?1e9:i;};
const ARTISTS=[{id:"all",label:"全部"}].concat(DATA.bands.slice().sort((a,b)=>bandRank(a.id)-bandRank(b.id)).map(b=>({id:b.id,label:b.ja})));
const TIERS=[{id:"all",label:"全部"},{id:"core",label:"核心",min:10},{id:"high",label:"高频",min:6},{id:"mid",label:"中频",min:3},{id:"base",label:"基础",min:2}];
const TIERNAME={core:"核心",high:"高频",mid:"中频",base:"基础"};
const POSNAME={n:"名词",v:"动词",a:"形容词",na:"形容动词",adv:"副词",pr:"代词",p:"助词",aux:"助动词",suf:"后缀",pre:"前缀",cj:"连词",adn:"连体词",int:"感叹词"};
const albumName=a=>a.short||a.ja;

// 助词、助动词等虚词的简短说明（词表不收虚词，点歌词时显示这里的解释）

function lsGet(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

let log=lsGet(LS_LOG,{});            // {日: {r:复习, n:新掌握, i:新词, q:测验}}
const today=()=>Math.floor((Date.now()-new Date().getTimezoneOffset()*60000)/86400000);
function bump(k,d=1){const t=today();const e=log[t]||(log[t]={r:0,n:0,i:0,q:0});e[k]=(e[k]||0)+d;}
function learnedWords(){return Object.keys(learned).filter(w=>learned[w]).sort();}

// ================= 云端同步 =================
// 用 Supabase 账号同步（data/site.json 里填了 supabase_url 和 supabase_key 才启用）；存的是 packCloud() 的 JSON
const CLOUD=SITE.supabase_url&&SITE.supabase_key?"supabase":"none";
let backend=null, account=null, syncState="local", writing=Promise.resolve(), pendingWrite=null, dirty=false;
function packCloud(){const since=today()-180;
  return {v:2,learned:learnedWords(),srs:Object.entries(srs).map(([w,[b,d]])=>[w,b,d]),
    log:Object.entries(log).filter(([d])=>+d>=since).map(([d,e])=>[+d,e.r||0,e.n||0,e.i||0,e.q||0])};}
function unpackCloud(o,merge){
  const L={},S={},G={};
  if(merge){learnedWords().forEach(w=>L[w]=true);Object.assign(S,srs);Object.entries(log).forEach(([d,e])=>G[d]={...e});}
  (o.learned||[]).forEach(w=>L[w]=true);
  (o.srs||[]).forEach(([w,b,d])=>{if(!S[w]||!merge||S[w][1]<d)S[w]=[b,d];});
  (o.log||[]).forEach(([d,r,n,i,q])=>{const e=G[d]||{r:0,n:0,i:0,q:0};G[d]={r:Math.max(e.r,r),n:Math.max(e.n,n),i:Math.max(e.i,i),q:Math.max(e.q,q)};});
  learned=L;srs=S;log=G;saveLocal();
}
function saveLocal(){lsSet(LS,learned);lsSet(LS_SRS,srs);lsSet(LS_LOG,log);}
function setSync(s){syncState=s;renderAccount();}
const sameAsLocal=o=>JSON.stringify(o||{})===JSON.stringify(packCloud());
// 这台设备第一次同步：本机进度和云端合并；以前同步过：以云端为准
async function adoptRemote(remote,flagKey){
  const before=JSON.stringify(packCloud());
  unpackCloud(remote||{},!lsGet(flagKey,false));
  if(!remote||!sameAsLocal(remote)) await backend.save(packCloud());
  lsSet(flagKey,true);
  if(JSON.stringify(packCloud())!==before) render();
}
function queueCloudWrite(){
  if(!backend)return;
  dirty=true;clearTimeout(pendingWrite);
  pendingWrite=setTimeout(()=>{
    writing=writing.then(()=>backend.save(packCloud()))
      .then(()=>{dirty=false;if(syncState!=="synced")setSync("synced");})
      .catch(()=>setSync("error"));
  },800);
}

// ---------- Supabase 账号（GitHub Pages 版） ----------
const SUPABASE_JS="vendor/supabase-js-2.117.2.js";
let sb=null, sbUid=null, lastPull=0, recovering=false;
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=()=>no(new Error("无法加载 "+src));document.head.appendChild(s);});}
async function initSupabase(){
  setSync("connecting");
  try{await loadScript(SUPABASE_JS);sb=window.supabase.createClient(SITE.supabase_url,SITE.supabase_key);}
  catch(e){setSync("error");return;}
  // 创建后会马上以 INITIAL_SESSION 回调一次当前登录状态；之后登录、退出、改密码都会回调
  sb.auth.onAuthStateChange((event,session)=>{
    if(event==="PASSWORD_RECOVERY"){recovering=true;openSheet(true);}
    setTimeout(()=>onSession(session),0);   // 官方建议：不要在回调里直接调用其他 supabase 方法
  });
}
async function onSession(session){
  const u=session&&session.user;
  if(!u){
    if(sbUid)lsSet(LS_SYNC+":"+sbUid,false);   // 退出后本机再学的内容，下次登录时合并上去
    sbUid=null;backend=null;account=null;dirty=false;setSync("signedout");return;
  }
  if(u.id===sbUid)return;
  sbUid=u.id;
  const md=u.user_metadata||{};
  account={nick:md.nickname||"",email:u.email||"",name:md.nickname||md.user_name||md.name||(u.email||"").split("@")[0]||"已登录",avatar:md.avatar_url||null};
  backend={save:async d=>{const {error}=await sb.from("progress").upsert({user_id:u.id,data:d,updated_at:new Date().toISOString()});if(error)throw error;}};
  setSync("connecting");
  await pullSupabase(true);
}
async function pullSupabase(first){
  const uid=sbUid;if(!uid)return;
  try{
    const {data,error}=await sb.from("progress").select("data").eq("user_id",uid).maybeSingle();
    if(error)throw error;
    if(uid!==sbUid)return;
    lastPull=Date.now();
    if(first)await adoptRemote(data?data.data:null,LS_SYNC+":"+uid);
    else if(data&&!dirty&&!sameAsLocal(data.data)){unpackCloud(data.data,false);render();}
    setSync("synced");
  }catch(e){setSync("error");}
}
// 切回这个页面时：有没保存的改动就补存；否则从云端拉一次（别的设备可能改过）
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState!=="visible"||!backend)return;
  if(dirty)queueCloudWrite();
  else if(CLOUD==="supabase"&&Date.now()-lastPull>30000)pullSupabase(false);
});

// ================= 假名 / 罗马音 =================
const KANJI=/[㐀-鿿々〆ヶ]/;
const toHira=s=>s.replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
const R={あ:"a",い:"i",う:"u",え:"e",お:"o",か:"ka",き:"ki",く:"ku",け:"ke",こ:"ko",さ:"sa",し:"shi",す:"su",せ:"se",そ:"so",た:"ta",ち:"chi",つ:"tsu",て:"te",と:"to",な:"na",に:"ni",ぬ:"nu",ね:"ne",の:"no",は:"ha",ひ:"hi",ふ:"fu",へ:"he",ほ:"ho",ま:"ma",み:"mi",む:"mu",め:"me",も:"mo",や:"ya",ゆ:"yu",よ:"yo",ら:"ra",り:"ri",る:"ru",れ:"re",ろ:"ro",わ:"wa",ゐ:"i",ゑ:"e",を:"wo",ん:"n",が:"ga",ぎ:"gi",ぐ:"gu",げ:"ge",ご:"go",ざ:"za",じ:"ji",ず:"zu",ぜ:"ze",ぞ:"zo",だ:"da",ぢ:"ji",づ:"zu",で:"de",ど:"do",ば:"ba",び:"bi",ぶ:"bu",べ:"be",ぼ:"bo",ぱ:"pa",ぴ:"pi",ぷ:"pu",ぺ:"pe",ぽ:"po",ゔ:"vu",ぁ:"a",ぃ:"i",ぅ:"u",ぇ:"e",ぉ:"o",ゃ:"ya",ゅ:"yu",ょ:"yo",ゎ:"wa"};
const SMALL=/[ゃゅょぁぃぅぇぉゎャュョァィゥェォヮ]/;
const PUNCT={"、":",","。":".","？":"?","！":"!","　":" ","…":"…","〜":"~","ー":"-"};
// 切成音节：拗音(きゃ)、促音(っ)与后一个音节合并，长音(ー)并入前一个音节
function morae(s){const out=[];for(const c of s){const last=out[out.length-1];
  if(last!==undefined&&(SMALL.test(c)||c==="ー")&&!/[っッ]$/.test(last))out[out.length-1]+=c;
  else if(last!==undefined&&/[っッ]$/.test(last))out[out.length-1]+=c;
  else out.push(c);}return out;}
function unitRoma(u){
  const h=toHira(u);
  if(/^っ/.test(h)){const r=unitRoma(h.slice(1));return r?(r.startsWith("ch")?"t"+r:r[0]+r):"";}
  if(h.endsWith("ー")){const r=unitRoma(h.slice(0,-1));const v=(r.match(/[aeiou](?!.*[aeiou])/)||[""])[0];return r+v;}
  const b=h[0], sm=h.slice(1);
  const r=R[b]; if(r===undefined) return PUNCT[b]!==undefined?PUNCT[b]:u;
  if(!sm) return r;
  const sr=R[sm]||"";
  if(/[ゃゅょ]/.test(sm)) return /^(shi|chi|ji)$/.test(r)?r.slice(0,-1)+sr.slice(1):r.slice(0,-1)+sr;
  if(b==="う") return "w"+sr;
  return r.replace(/[aeiou]$/,"")+sr;
}
function romaji(s){const us=morae(s);let out="";us.forEach((u,i)=>{let r=unitRoma(u);
  if(r==="n"&&i+1<us.length){const nx=unitRoma(us[i+1]);if(/^[aeiouy]/.test(nx))r="n'";}out+=r;});return out;}
// 一段里每个词分别的读音 → 罗马音，词和词之间加「·」：忘れ|られ|ない → wasure·rare·nai
// 促音「っ」落在两个词之间时拆开：言っ|て → it·te
function dottedRoma(parts){
  const s=parts.join(""), ends=new Set();let acc=0;parts.forEach(p=>{acc+=p.length;if(p.length)ends.add(acc);});
  const us=morae(s);let pos=0, out="";
  us.forEach((u,i)=>{let r=unitRoma(u);
    if(r==="n"&&i+1<us.length&&/^[aeiouy]/.test(unitRoma(us[i+1])))r="n'";
    if(/^[っッ]/.test(u)&&u.length>1&&ends.has(pos+1)){const rest=unitRoma(u.slice(1));out+=r.slice(0,r.length-rest.length)+"·"+rest;}
    else out+=r;
    pos+=u.length;if(ends.has(pos)&&pos<s.length)out+="·";});
  return out;
}
function sylRoma(k){return k.split(" / ").map(a=>morae(a.replace(/[〜~]/g,"")).map(unitRoma).join("·")).join(" / ");}

// ================= 朗读（浏览器自带的日语语音） =================
const TTS={ok:typeof window.speechSynthesis!=="undefined"&&typeof window.SpeechSynthesisUtterance!=="undefined",voice:null,warned:false};
function pickVoice(){try{const vs=speechSynthesis.getVoices();TTS.voice=vs.find(v=>/^ja/i.test(v.lang))||null;}catch(e){}}
if(TTS.ok){pickVoice();try{speechSynthesis.addEventListener("voiceschanged",pickVoice);}catch(e){}}else document.documentElement.classList.add("no-tts");
function speak(text){
  if(!TTS.ok||!text)return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="ja-JP";if(TTS.voice)u.voice=TTS.voice;u.rate=ui.rate;speechSynthesis.speak(u);}catch(e){toast("这里不能朗读。");return;}
  if(!TTS.voice&&!TTS.warned&&speechSynthesis.getVoices().length){TTS.warned=true;toast("这台设备没有找到日语语音，读音可能不准。可以在系统设置里添加日语语音。");}
}
const tokParts=t=>typeof t==="string"?{s:t,k:"",p:""}:{s:t[0],k:t[1]||"",p:t[2]||"",l:t[3]||t[0],lk:t[4]||""};
function lineReading(sid,li){return DATA.lines[sid][li][2].map(seg=>seg.map(t=>{const x=tokParts(t);return /^[\s　]+$/.test(x.s)?"、":toHira(x.k||x.s);}).join("")).join("");}
const wordReading=v=>v.k.split(" / ")[0].replace(/[〜~]/g,"");
const SPK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';

function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;}
function esc(s){return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");}
function rubyEl(base,rt){const r=el("ruby");r.appendChild(document.createTextNode(base));r.appendChild(el("rt",null,rt));return r;}
// 把词切成汉字段和假名段，给每个汉字段分配读音：思い出(おもいで) → [思,おも][い][出,で]；对不上时返回 null
function rubySplit(s,k){
  const runs=s.match(/[㐀-鿿々〆ヶ]+|[^㐀-鿿々〆ヶ]+/g);
  const m=toHira(k).match(new RegExp("^"+runs.map(r=>KANJI.test(r)?"(.+?)":esc(toHira(r))).join("")+"$"));
  if(!m)return null;
  let g=1;return runs.map(r=>[r,KANJI.test(r)?m[g++]:null]);
}
// 汉字部分注假名，送假名不注：思い出(おもいで) → 思[おも]い出[で]
function rubyNodes(s,k){
  const f=document.createDocumentFragment();
  if(!k||!KANJI.test(s)){f.appendChild(document.createTextNode(s));return f;}
  const parts=rubySplit(s,k);
  if(!parts){f.appendChild(rubyEl(s,toHira(k)));return f;}
  parts.forEach(([r,rd])=>f.appendChild(rd?rubyEl(r,rd):document.createTextNode(r)));
  return f;
}
// 「按字」显示罗马音时，一个词拆成的小格：每段汉字一格（罗马音是它的读音），假名每个音节一格
function tokUnits(x){
  const k=x.k?toHira(x.k):"", cell=(n,r)=>({node:n,r});
  const kana=t=>morae(t).map(u=>cell(document.createTextNode(u),unitRoma(u)));
  if(KANJI.test(x.s)&&k){
    const parts=rubySplit(x.s,k);
    if(!parts)return [cell(rubyEl(x.s,k),romaji(k))];
    return parts.flatMap(([r,rd])=>rd?[cell(rubyEl(r,rd),romaji(rd))]:kana(r));
  }
  if(k&&k!==toHira(x.s))return [cell(document.createTextNode(x.s),romaji(k))];   // 助词 は/へ 读 wa/e
  return kana(x.s);
}

// ---------- 词条 / 语法在每行里的位置（点词时查） ----------
let IDX=null;
function buildIdx(){IDX={};const add=(item,kind)=>Object.entries(item.loc||{}).forEach(([sid,hs])=>hs.forEach(([li,a,b])=>{(IDX[sid+"|"+li]||(IDX[sid+"|"+li]=[])).push([a,b,kind,item]);}));
  DATA.vocab.forEach(v=>add(v,"v"));DATA.grammar.forEach(g=>add(g,"g"));}
function covering(sid,li,a,b){if(!IDX)buildIdx();
  let key=sid+"|"+li;
  // 重录版本（dup_of）不参与计数，没有自己的出现位置：按歌词原文找到原版里同样的一行
  const s=songById[sid];
  if(s&&s.dup_of&&!IDX[key]){const ja=DATA.lines[sid][li][0], j=(DATA.lines[s.dup_of]||[]).findIndex(l=>l[0]===ja);if(j>=0)key=s.dup_of+"|"+j;}
  return (IDX[key]||[]).filter(([x,y])=>x<b&&a<y);}

// 一行歌词：分段，汉字注假名，段下标罗马音；每个词可以点；opts: spans 高亮, blank 挖空, time 显示时间
function lyricLine(sid,li,opts={}){
  const [ja,zh,segs,t]=DATA.lines[sid][li];
  const box=el("div","ll"), row=el("div","lj");
  let pos=0;
  segs.forEach(seg=>{
    const text=seg.map(x=>tokParts(x).s).join("");
    if(/^[\s　]+$/.test(text)){row.appendChild(el("span","seg gap"));pos+=text.length;return;}
    if(ui.roMode==="char"){row.appendChild(charSeg(sid,li,seg,pos,opts));pos+=text.length;return;}
    const sg=el("span","seg"), top=el("span","sj"); let parts=[], hit=false, blanked=false;
    seg.forEach(tok=>{
      const x=tokParts(tok), a=pos, b=pos+x.s.length; pos=b;
      if(opts.blank&&opts.blank[0]<b&&a<opts.blank[1]){if(!blanked){top.appendChild(el("span","blank","？"));blanked=true;}parts=[];return;}
      let node=rubyNodes(x.s,KANJI.test(x.s)?x.k:null);
      if(opts.spans&&opts.spans.some(([p,q])=>p<b&&a<q)){hit=true;const m=el("mark");m.appendChild(node);node=m;}
      if(x.p){const w=el("span","tk");w.appendChild(node);w.onclick=e=>{e.stopPropagation();openTokPop(sid,li,a,b,x);};node=w;}
      top.appendChild(node);
      parts.push(toHira(x.k||x.s));
    });
    const ro=ui.roDots?dottedRoma(parts):romaji(parts.join(""));
    sg.append(top,el("span","sr"+(hit?" hit":""),blanked?"?":(ro||" ")));row.appendChild(sg);
  });
  box.appendChild(row);
  const foot=el("div","lf");
  if(opts.seek){box.dataset.sid=sid;box.dataset.li=li;}
  if(opts.seek&&t!=null&&plOn()){const b=el("button","lplay","▶ "+fmtTime(t));b.type="button";b.setAttribute("aria-label","从这句开始播放（"+fmtTime(t)+"）");
    b.onclick=e=>{e.stopPropagation();plPlayAt(sid,t);};foot.appendChild(b);}
  else if(opts.time!==false&&t!=null)foot.appendChild(el("span","lt",fmtTime(t)));
  foot.appendChild(el("div","lz",zh||""));
  if(!opts.blank)foot.appendChild(spkBtn(()=>lineReading(sid,li),"朗读这句"));
  box.appendChild(foot);
  return box;
}
// 按字模式的一段：每格上面是字（汉字带注音），下面是这格的罗马音
function charSeg(sid,li,seg,pos,opts){
  const sg=el("span","seg cs"), cells=[];let blanked=false;
  const addCell=(parent,node,r,hit)=>{const c=el("span","cu"), top=el("span","sj"), ro=el("span","sr"+(hit?" hit":""),r);
    if(hit){const m=el("mark");m.appendChild(node);node=m;}
    top.appendChild(node);c.append(top,ro);parent.appendChild(c);return ro;};
  seg.forEach(tok=>{
    const x=tokParts(tok), a=pos, b=pos+x.s.length; pos=b;
    if(opts.blank&&opts.blank[0]<b&&a<opts.blank[1]){if(!blanked){blanked=true;addCell(sg,el("span","blank","？"),"?");}return;}
    const hit=!!(opts.spans&&opts.spans.some(([p,q])=>p<b&&a<q));
    const box=x.p?el("span","tk tkc"):sg;
    tokUnits(x).forEach(u=>cells.push([u,addCell(box,u.node,u.r,hit)]));
    if(x.p){box.onclick=e=>{e.stopPropagation();openTokPop(sid,li,a,b,x);};sg.appendChild(box);}
  });
  // 词尾的促音「っ」单独一格时没有读音，用下一格的辅音表示（言っ|て → t|te）
  cells.forEach(([u,ro],i)=>{if(!u.r&&/[っッ]$/.test(u.node.textContent)){const nx=cells[i+1];ro.textContent=nx&&nx[0].r?(nx[0].r.startsWith("ch")?"t":nx[0].r[0]):"";}
    if(!ro.textContent)ro.textContent=" ";});
  return sg;
}
function spansAt(item,sid,li){return ((item.loc||{})[sid]||[]).filter(h=>h[0]===li).map(h=>[h[1],h[2]]);}
function exampleBox(item,label){
  if(!item.x)return null;
  const [sid,li]=item.x, s=songById[sid];
  const b=el("div","exbox");b.appendChild(el("div","exlabel",label||"歌词例句"));
  b.appendChild(lyricLine(sid,li,{spans:spansAt(item,sid,li)}));
  const src=el("div","src");src.append("出自 ",el("b",null,"《"+songTitle(s)+"》")," · "+albumName(albumById[s.album]));
  b.appendChild(src);return b;
}
// 出现在很多歌里的词，原句会很长：先显示前几首、每首前几句，其余点按钮展开；底部可以收起
const OCC_SONGS=4, OCC_LINES=3;
function moreBtn(text,onClick){const b=el("button","more",text);b.type="button";b.onclick=e=>{e.stopPropagation();onClick(b);};return b;}
function occDetails(item,hits,label){
  const d=el("details","occ");const sum=el("summary",null,label+"（"+hits.length+" 首）");d.appendChild(sum);
  let built=false;
  const songBox=([sid,c])=>{
    const s=songById[sid], a=albumById[s.album], box=el("div","ctxsong");
    const head=el("div","ctxhead"), left=el("div");
    left.append(el("div","ctxt",songTitle(s)),el("div","ctxa",s.zh+" · 《"+a.ja+"》"));
    head.append(left,el("div","gcount",c+" 次"));box.appendChild(head);
    const byLine=new Map();
    ((item.loc||{})[sid]||[]).forEach(([li,x,y])=>{if(!byLine.has(li))byLine.set(li,[]);byLine.get(li).push([x,y]);});
    const lis=[...byLine.keys()].sort((p,q)=>p-q), line=li=>lyricLine(sid,li,{spans:byLine.get(li)});
    lis.slice(0,OCC_LINES).forEach(li=>box.appendChild(line(li)));
    if(lis.length>OCC_LINES)box.appendChild(moreBtn("这首还有 "+(lis.length-OCC_LINES)+" 句",b=>b.replaceWith(...lis.slice(OCC_LINES).map(line))));
    return box;
  };
  d.addEventListener("toggle",()=>{if(!d.open||built)return;built=true;
    const list=hits.slice().sort((x,y)=>y[1]-x[1]);
    list.slice(0,OCC_SONGS).forEach(h=>d.appendChild(songBox(h)));
    const foot=el("div","occfoot");
    if(list.length>OCC_SONGS)foot.appendChild(moreBtn("展开其余 "+(list.length-OCC_SONGS)+" 首",b=>{b.remove();foot.before(...list.slice(OCC_SONGS).map(songBox));}));
    foot.appendChild(moreBtn("收起",()=>{d.open=false;if(sum.getBoundingClientRect().top<0)sum.scrollIntoView({block:"center"});}));
    d.appendChild(foot);
  });
  d.addEventListener("click",e=>e.stopPropagation());
  return d;
}

function activeSongIds(){return DATA.songs.filter(s=>{const a=albumById[s.album];
  if(st.artist!=="all"&&a.artist!==st.artist)return false;if(st.albums.size&&!st.albums.has(s.album))return false;return true;}).map(s=>s.id);}
function scoped(item,ids){const set=new Set(ids);let songs=0,total=0;const hits=[];
  for(const [sid,c] of Object.entries(item.occ)){if(set.has(sid)){songs++;total+=c;hits.push([sid,c]);}}return {songs,total,hits};}
function tierOf(n){return n>=10?"core":n>=6?"high":n>=3?"mid":"base";}
const norm=s=>toHira((s||"").toLowerCase()).replace(/[\s·・'’\-〜~（）()「」、，,。/]/g,"");
function matchVocab(v,q){if(!q)return true;const n=norm(q);
  return norm(v.w).includes(n)||norm(v.k).includes(n)||norm(v.r).includes(n)||v.m.includes(q.trim())||v.k.split(" / ").some(k=>romaji(toHira(k)).includes(n));}
function scopeVocab(){const ids=activeSongIds();
  let list=DATA.vocab.map(v=>{const s=scoped(v,ids);return {...v,...s,tier:tierOf(s.songs)};}).filter(v=>v.songs>=2);
  if(st.tier!=="all")list=list.filter(v=>v.tier===st.tier);
  return list.sort((a,b)=>b.songs-a.songs||b.total-a.total);}
function filteredVocab(){let list=scopeVocab();
  if(st.state==="todo")list=list.filter(v=>!learned[v.w]);
  if(st.state==="done")list=list.filter(v=>learned[v.w]);
  return list;}

// ================= 关系图 =================
// 以一个词为中心，画出和它关系最近的词。关系有三种：同一句歌词里一起出现、同一首歌里一起出现、写法里有同一个汉字
const GRAPH_N=14, GKINDS=[{id:"line",label:"同一句里"},{id:"song",label:"同一首歌里"},{id:"kanji",label:"同一个汉字"}];
let LINEW=null, SONGW=null, gTrail=[];
function buildGraphIdx(){LINEW=new Map();SONGW=new Map();
  DATA.vocab.forEach((v,i)=>{
    Object.entries(v.loc||{}).forEach(([sid,hs])=>hs.forEach(([li])=>{const k=sid+"|"+li;let a=LINEW.get(k);if(!a)LINEW.set(k,a=[]);if(a[a.length-1]!==i)a.push(i);}));
    Object.keys(v.occ).forEach(sid=>{let a=SONGW.get(sid);if(!a)SONGW.set(sid,a=[]);a.push(i);});});}
const vIdx=new Map(DATA.vocab.map((v,i)=>[v,i]));
const kanjiOf=v=>[...new Set([...v.w].filter(c=>KANJI.test(c)))];
function vLines(v,set){const out=new Set();Object.entries(v.loc||{}).forEach(([sid,hs])=>{if(set.has(sid))hs.forEach(([li])=>out.add(sid+"|"+li));});return out;}
function vSongs(v,set){return Object.keys(v.occ).filter(sid=>set.has(sid));}
// 返回 [{v, n: 一起出现的次数, score, keys: 一起出现的句子/歌}]，score 用 n/√(两边各自的次数) 压低「君」「僕」这类到处都有的词
function relations(c,kind,set){
  if(!LINEW)buildGraphIdx();
  const ci=vIdx.get(c), acc=new Map(), add=(j,key)=>{if(j===ci)return;let r=acc.get(j);if(!r)acc.set(j,r={n:0,keys:[]});r.n++;r.keys.push(key);};
  let size=j=>1, base=1;
  if(kind==="line"){const ls=vLines(c,set);base=ls.size;ls.forEach(k=>(LINEW.get(k)||[]).forEach(j=>add(j,k)));
    const cache=new Map();size=j=>{if(!cache.has(j))cache.set(j,vLines(DATA.vocab[j],set).size);return cache.get(j);};}
  else if(kind==="song"){const ss=vSongs(c,set);base=ss.length;ss.forEach(sid=>(SONGW.get(sid)||[]).forEach(j=>add(j,sid)));size=j=>vSongs(DATA.vocab[j],set).length;}
  else{const ks=kanjiOf(c);DATA.vocab.forEach((v,j)=>{if(!vSongs(v,set).length)return;kanjiOf(v).forEach(k=>{if(ks.includes(k))add(j,k);});});}
  let out=[...acc].map(([j,r])=>({v:DATA.vocab[j],n:r.n,keys:r.keys}));
  if(kind==="kanji")out.forEach(r=>r.score=r.n+vSongs(r.v,set).length/100);
  else{out.forEach(r=>r.score=r.n/Math.sqrt(base*Math.max(1,size(vIdx.get(r.v)))));
    const strong=out.filter(r=>r.n>=2);if(strong.length>=6)out=strong;}
  return out.sort((a,b)=>b.score-a.score||b.n-a.n).slice(0,GRAPH_N);
}
// 周围的词彼此之间的连线（同样的算法，只画最强的一些）
function crossLinks(nb,kind,set){
  const out=[];
  if(kind==="kanji"){for(let a=0;a<nb.length;a++)for(let b=a+1;b<nb.length;b++){const ka=kanjiOf(nb[a].v);if(kanjiOf(nb[b].v).some(k=>ka.includes(k)))out.push([a,b,1]);}return out;}
  const sets=nb.map(r=>kind==="line"?vLines(r.v,set):new Set(vSongs(r.v,set)));
  for(let a=0;a<nb.length;a++)for(let b=a+1;b<nb.length;b++){let n=0;sets[a].forEach(k=>{if(sets[b].has(k))n++;});
    const sc=n/Math.sqrt(sets[a].size*sets[b].size||1);if(n>=2&&sc>=(kind==="line"?.12:.45))out.push([a,b,sc]);}
  return out.sort((x,y)=>y[2]-x[2]).slice(0,18);
}

// ================= 播放器：接自己部署的网易云 API（api-enhanced） =================
// 服务器地址、访问密码、网易云登录凭证只存在这个浏览器里（LS_PLAYER），不进云端同步，也不进「复制我的进度」。
// 请求都用 POST 表单（跨域「简单请求」，不触发预检）；访问密码放在查询参数 k 里，由反向代理检查；
// 登录凭证、手机号、验证码放在请求体里，不会出现在服务器的访问日志里。
// api-enhanced 按「地址 + Cookie 头」缓存 2 分钟，不看请求体，所以跟登录状态有关的请求都在地址里带 timestamp。
const LS_PLAYER="yoru_player_v1";
const pl=Object.assign({url:"",k:"",cookie:"",user:null,level:"exhigh",follow:true,ne:{}},lsGet(LS_PLAYER,{}));
function savePl(){lsSet(LS_PLAYER,pl);}
function plOn(){return !!pl.url;}
function plErr(code,msg){const e=new Error(msg||code);e.code=code;return e;}
async function ncm(path,query={},body={},o={}){
  const u=new URL(pl.url.replace(/\/+$/,"")+path);
  if(pl.k)u.searchParams.set("k",pl.k);
  for(const [a,b] of Object.entries(query))u.searchParams.set(a,b);
  if(!o.cache)u.searchParams.set("timestamp",Date.now());
  const fd=new URLSearchParams();for(const [a,b] of Object.entries(body))if(b)fd.set(a,b);
  const ctl=new AbortController(), timer=setTimeout(()=>ctl.abort(),o.timeout||15000);
  let r;
  try{r=await fetch(u,{method:"POST",body:fd,signal:ctl.signal,cache:"no-store"});}
  catch(e){throw plErr(ctl.signal.aborted?"timeout":"net");}
  finally{clearTimeout(timer);}
  let j=null;try{j=await r.json();}catch(e){}
  if(!j)throw plErr("http","播放服务器返回了 "+r.status+"，内容不是 JSON。");
  return j;
}
const withCookie=b=>Object.assign({cookie:pl.cookie},b);
function plErrText(e){
  if(e&&e.code==="net")return "连不上播放服务器。请检查地址（包括 https:// 和端口）、访问密码，以及 NAS 上的容器有没有在运行。";
  if(e&&e.code==="timeout")return "播放服务器太久没有响应，稍后再试。";
  return (e&&e.message)||"出错了";
}
function normUrl(s){s=(s||"").trim();if(!s)return null;if(!/^https?:\/\//i.test(s))s="https://"+s;
  try{const u=new URL(s);return u.origin+u.pathname.replace(/\/+$/,"");}catch(e){return null;}}

let plEditing=false, plStatus=null, plChecking=false, qr=null, smsOpen=false, smsT=null;

  if(p){const av=(p.avatarUrl||"").replace(/^http:/,"https:");
    pl.user={name:p.nickname||"",avatar:av?av+"?param=80y80":"",vip:((a&&a.vipType)||p.vipType||0)>0};}
  else pl.user=null;
  savePl();
}
// 测试服务器，顺便读网易云登录状态
async function plCheck(){
  try{const j=await ncm("/login/status",{},withCookie()), d=j.data;
    if(!d||d.code!==200){plStatus="播放服务器连上了，但它访问网易云时出错（"+(j.msg||j.message||j.code)+"）。";return false;}
    plSetUser(d.profile,d.account);plStatus="ok";return true;}
  catch(e){plStatus=plErrText(e);return false;}
}
function plRefresh(){if(ui.view==="songs")renderSongs();}
function renderPlayerSettings(){
  const on=plOn(), editing=plEditing||!on;
  document.getElementById("plText").textContent=on
    ?"登录网易云会员后可以听完整版；不登录的话，会员歌只能试听 30 秒。登录凭证只存在这个浏览器里，只发给你自己的播放服务器。"
    :"填上自己部署的网易云 API 服务器（比如家里 NAS 上的 api-enhanced）的地址和访问密码，就能在歌曲页直接播放，歌词跟着高亮。地址和密码只存在这个浏览器里，不会同步到云端。部署方法见仓库里的 docs/player.md。";
  const sum=document.getElementById("plSum");sum.hidden=editing;sum.innerHTML="";
  if(!editing){
    sum.append(el("span",null,"服务器："),el("b",null,pl.url.replace(/^https:\/\//,"")),
      el("span",plStatus==="ok"?"okd":plStatus?"bad":null,plStatus==="ok"?"✓ 已连上":plStatus?"✗ 连不上":plChecking?"检查中…":""));
    const ed=el("button","linkbtn","修改");ed.type="button";ed.onclick=()=>{plEditing=true;renderPlayerSettings();document.getElementById("plUrl").focus();};
    sum.appendChild(ed);
  }
  const f=document.getElementById("plForm");f.hidden=!editing;
  if(editing&&!f.contains(document.activeElement)){document.getElementById("plUrl").value=pl.url;document.getElementById("plKey").value=pl.k;}
  document.getElementById("plCancel").hidden=!on;
  document.getElementById("plForget").hidden=!on;
  const acct=document.getElementById("plAcct");acct.hidden=editing;
  if(editing)return;
  if(plStatus===null&&!plChecking){plChecking=true;plCheck().then(()=>{plChecking=false;renderPlayerSettings();});}
  const who=document.getElementById("plWho");who.innerHTML="";
  if(pl.user){
    let av;if(pl.user.avatar){av=el("img");av.src=pl.user.avatar;av.alt="";}else av=el("span","ph",(pl.user.name||"?").charAt(0));
    const t=el("div"), nm=el("b",null,pl.user.name||"网易云用户");t.appendChild(nm);
    if(pl.user.vip)t.appendChild(el("span","vip","会员"));
    t.appendChild(el("div","am","已登录网易云音乐"));who.append(av,t);
  }else who.appendChild(el("div","am",pl.cookie?"网易云的登录已经过期，请重新登录。":"还没有登录网易云音乐。"));
  const logged=!!pl.user;
  document.getElementById("plLoginBtns").hidden=logged||!!qr;
  document.getElementById("plSms").hidden=logged||!smsOpen;
  document.getElementById("plOut").hidden=!logged;
  chipRow(document.getElementById("plLevel"),[{v:"standard",label:"标准"},{v:"exhigh",label:"极高"},{v:"lossless",label:"无损"}],
    x=>pl.level===x.v,x=>{pl.level=x.v;savePl();renderPlayerSettings();});
  document.getElementById("plFollow").checked=pl.follow;
}
document.getElementById("plForm").onsubmit=async e=>{
  e.preventDefault();
  const msg=document.getElementById("plMsg"), bad=t=>{msg.className="msg err";msg.textContent=t;};
  const url=normUrl(document.getElementById("plUrl").value), k=document.getElementById("plKey").value.trim();
  if(!url)return bad("请填写服务器地址，例如 https://music.example.com:8443");
  if(location.protocol==="https:"&&/^http:/.test(url)&&!/^http:\/\/(localhost|127\.0\.0\.1)(:|\/|$)/.test(url))
    return bad("这个网页是 https 的，服务器地址也要用 https://，不然浏览器会拦下来。");
  if(url!==pl.url)pl.ne={};
  pl.url=url;pl.k=k;savePl();plEditing=true;
  msg.className="msg";msg.textContent="正在测试…";
  plChecking=true;const ok=await plCheck();plChecking=false;
  if(ok){msg.textContent="已连上播放服务器。";plEditing=false;}else bad(plStatus);
  renderPlayerSettings();plRefresh();
};
document.getElementById("plCancel").onclick=()=>{plEditing=false;document.getElementById("plMsg").textContent="";renderPlayerSettings();};
document.getElementById("plForget").onclick=()=>{
  if(!confirm("清除这台设备上的播放服务器地址、访问密码和网易云登录？"))return;
  if(pl.cookie)ncm("/logout",{},{cookie:pl.cookie}).catch(()=>{});
  plStop();qrStop();smsOpen=false;
  Object.assign(pl,{url:"",k:"",cookie:"",user:null,ne:{}});savePl();
  plStatus=null;plEditing=false;
  document.getElementById("plMsg").textContent="已清除。";
  renderPlayerSettings();plRefresh();
};
document.getElementById("plFollow").onchange=e=>{pl.follow=e.target.checked;savePl();};
function loginMsg(t,err){const m=document.getElementById("plLoginMsg");m.className="msg"+(err?" err":"");m.textContent=t||"";}
async function plLoggedIn(cookie){
  pl.cookie=cookie||"";savePl();smsOpen=false;
  loginMsg("登录成功，正在读取账号信息…");
  await plCheck();
  if(pl.user)loginMsg("已登录网易云："+pl.user.name);else loginMsg("登录好像没有成功，请再试一次。",true);
  renderPlayerSettings();
}
// 扫码登录：/login/qr/key → /login/qr/create → 每 2.5 秒查一次 /login/qr/check（800 过期、801 等待、802 待确认、803 成功）
function qrStop(){if(qr){clearInterval(qr.timer);qr=null;}const b=document.getElementById("plQr");if(b)b.hidden=true;}
async function qrStart(){
  qrStop();smsOpen=false;loginMsg("");
  const me=qr={timer:0,busy:false,key:""}, img=document.getElementById("plQrImg"), txt=document.getElementById("plQrText");
  document.getElementById("plQr").hidden=false;img.removeAttribute("src");img.hidden=true;txt.textContent="正在生成二维码…";renderPlayerSettings();
  try{
    const k=await ncm("/login/qr/key"), key=k.data&&k.data.unikey;
    if(!key)throw plErr("x","没拿到二维码（"+(k.msg||k.message||k.code)+"）。");
    const c=await ncm("/login/qr/create",{key,qrimg:"true",platform:"web"});
    if(qr!==me)return;
    img.src=c.data.qrimg;img.hidden=false;me.key=key;
    txt.textContent=matchMedia("(pointer:coarse)").matches
      ?"用网易云音乐 App 的「扫一扫」扫这个二维码，再在手机上点确认。如果只有这一台手机，改用验证码登录更方便。"
      :"打开手机上的网易云音乐 App，用「扫一扫」扫这个二维码，再在手机上点确认。";
    me.timer=setInterval(qrPoll,2500);
  }catch(e){if(qr===me)txt.textContent=plErrText(e);}
}
async function qrPoll(){
  const me=qr;if(!me||me.busy||!me.key)return;me.busy=true;
  const txt=document.getElementById("plQrText");
  try{
    const r=await ncm("/login/qr/check",{key:me.key,noCookie:"true"});
    if(qr!==me)return;
    if(r.code===800){qrStop();loginMsg("二维码过期了，请重新点「扫码登录网易云」。",true);renderPlayerSettings();}
    else if(r.code===802)txt.textContent="已扫码，请在手机上点「确认登录」。";
    else if(r.code===803){qrStop();await plLoggedIn(r.cookie);}
    else txt.textContent="网易云返回："+(r.message||r.msg||r.code);
  }catch(e){if(qr===me)txt.textContent=plErrText(e);}
  finally{me.busy=false;}
}
document.getElementById("plQrBtn").onclick=qrStart;
document.getElementById("plQrCancel").onclick=()=>{qrStop();renderPlayerSettings();};
// 手机验证码登录
const phoneVal=()=>document.getElementById("plPhone").value.replace(/\D/g,"");
document.getElementById("plSmsBtn").onclick=()=>{qrStop();smsOpen=true;loginMsg("");renderPlayerSettings();document.getElementById("plPhone").focus();};
document.getElementById("plSend").onclick=async()=>{
  const phone=phoneVal(), b=document.getElementById("plSend");
  if(!/^1\d{10}$/.test(phone))return loginMsg("请填 11 位手机号。",true);
  b.disabled=true;loginMsg("正在发送…");
  try{
    const j=await ncm("/captcha/sent",{},{phone});
    if(j.code===200){
      loginMsg("验证码已发送。");let n=60;b.textContent=n+" 秒后重发";clearInterval(smsT);
      smsT=setInterval(()=>{n--;if(n<=0){clearInterval(smsT);b.disabled=false;b.textContent="发送验证码";}else b.textContent=n+" 秒后重发";},1000);
      document.getElementById("plCode").focus();return;
    }
    loginMsg("发送失败："+(j.message||j.msg||j.code),true);
  }catch(e){loginMsg(plErrText(e),true);}
  b.disabled=false;
};
document.getElementById("plSms").onsubmit=async e=>{
  e.preventDefault();
  const phone=phoneVal(), captcha=document.getElementById("plCode").value.trim();
  if(!/^1\d{10}$/.test(phone)||!/^\d{4,6}$/.test(captcha))return loginMsg("请填手机号和收到的验证码。",true);
  loginMsg("正在登录…");
  try{
    const j=await ncm("/login/cellphone",{},{phone,captcha});
    if(j.code===200&&j.cookie){document.getElementById("plCode").value="";await plLoggedIn(j.cookie);return;}
    loginMsg(j.code===503?"验证码不对，或者已经过期。"
      :[8821,-462,10004].includes(j.code)?"网易云要求额外的安全验证，这次请改用扫码登录。"
      :"登录失败："+(j.message||j.msg||j.code),true);
  }catch(e){loginMsg(plErrText(e),true);}
};
document.getElementById("plOut").onclick=()=>{
  const c=pl.cookie;pl.cookie="";pl.user=null;savePl();
  if(c)ncm("/logout",{},{cookie:c}).catch(()=>{});
  loginMsg("已退出网易云。");renderPlayerSettings();
};

// ---------- 播放 ----------
const audio=new Audio();audio.preload="auto";
// sid 当前歌；q/qi 播放队列（整张专辑）；li 正在唱的歌词行；off/end 试听片段在整首歌里的起止（毫秒）；loop 单句循环
const P={sid:null,q:[],qi:0,li:-1,off:0,end:0,loop:false,tok:0,real:false,src:"",urlAt:0,seekTo:null,retried:false,ended:false,msgKind:null};
// iPhone 要求第一次播放发生在点击里；拿播放地址要等网络，所以先在点击时播一小段静音，之后同一个 audio 就能直接播
const SILENT="data:audio/wav;base64,UklGRnQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YVAAAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgA==";
let unlocked=false;
function unlockAudio(){if(unlocked)return;unlocked=true;if(P.real)return;try{audio.src=SILENT;const p=audio.play();if(p)p.catch(()=>{});}catch(e){}}
const PICON={play:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></svg>',
  pause:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" fill="currentColor"/></svg>',
  replay:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></svg>',
  nextl:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h12M12 6l6 6-6 6"/></svg>',
  loop:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3l3 3-3 3"/><path d="M4 11V9a3 3 0 0 1 3-3h13"/><path d="M7 21l-3-3 3-3"/><path d="M20 13v2a3 3 0 0 1-3 3H4"/><path d="M11 10.5l1.5-1v5"/></svg>',
  next:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6l9 6-9 6z" fill="currentColor"/><path d="M17.5 6v12" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>',
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>'};
[["pbPrevL","replay"],["pbNextL","nextl"],["pbLoop","loop"],["pbNext","next"],["pbClose","close"]].forEach(([id,ic])=>document.getElementById(id).innerHTML=PICON[ic]);
const pbar=document.getElementById("pbar");
function albumQueue(aid){return DATA.songs.filter(s=>s.album===aid).map(s=>s.id);}
// 网易云的歌曲 id：catalog.json 里有就用；没有就按「歌名 乐队名」搜一次，结果记在本机
async function neId(s){
  const L=s.links||{};if(L.ne)return L.ne;if(pl.ne[s.id])return pl.ne[s.id];
  const band=bandById[albumById[s.album].artist].ja, title=s.ja.replace(/\s*\([^)]*\)\s*$/,"");
  const j=await ncm("/cloudsearch",{keywords:title+" "+band,limit:"10"},{},{cache:true});
  const list=(j.result&&j.result.songs)||[], n=x=>(x||"").toLowerCase().replace(/\s/g,""), byBand=x=>(x.ar||[]).some(a=>a.name===band);
  const hit=list.find(x=>n(x.name).startsWith(n(title))&&byBand(x))||list.find(byBand);
  if(!hit)return null;
  pl.ne[s.id]=hit.id;savePl();return hit.id;
}
function plMsg(t,kind){const m=document.getElementById("pbMsg");m.textContent=t||"";m.hidden=!t;m.className="pmsg"+(kind==="err"?" err":"");P.msgKind=t?kind||"info":null;}
function plShowBar(){pbar.hidden=false;document.body.classList.add("pb");}
// --pbh 播放条高度；--pbb 播放条离底边的距离（手机上底部导航是固定的，播放条放在它上面）
const tabsEl=document.getElementById("tabs");
function plLayout(){const r=document.documentElement.style;r.setProperty("--pbh",pbar.offsetHeight+"px");
  r.setProperty("--pbb",(getComputedStyle(tabsEl).position==="fixed"?tabsEl.offsetHeight:0)+"px");}
const plRO=new ResizeObserver(plLayout);plRO.observe(pbar);plRO.observe(tabsEl);
async function plPlay(sid,o={}){
  const s=songById[sid];if(!s)return;
  if(!plOn()){openSheet(true);return;}
  const fresh=!unlocked;unlockAudio();
  if(o.queue)P.q=o.queue;else if(!P.q.includes(sid))P.q=[sid];
  P.qi=Math.max(0,P.q.indexOf(sid));
  const tok=++P.tok, changed=P.sid!==sid;
  P.sid=sid;P.li=-1;P.ended=false;P.real=false;if(!o.keepLoop)P.loop=false;
  if(!fresh)audio.pause();
  plShowBar();plMsg("正在获取播放地址…");plRenderBar();plMarkRows();plMarkLyrics(false);
  if(changed)mediaMeta();
  try{
    const id=await neId(s);if(tok!==P.tok)return;
    if(!id)throw plErr("x","网易云上没找到这首歌。");
    const j=await ncm("/song/url/v1",{id,level:pl.level},withCookie());if(tok!==P.tok)return;
    const d=(j.data||[])[0];
    if(!d||!d.url)throw plErr("x","这首歌暂时拿不到播放地址（可能网易云没有版权"+(pl.user?"":"，或者要登录会员")+"）。");
    const ft=d.freeTrialInfo&&typeof d.freeTrialInfo==="object"?d.freeTrialInfo:null;
    P.off=ft?(ft.start||0)*1000:0;P.end=ft?(ft.end||0)*1000:0;
    P.src=location.protocol==="https:"?d.url.replace(/^http:/,"https:"):d.url;P.urlAt=Date.now();P.retried=!!o.retry;   // 网页是 https 时音频也要 https
    P.seekTo=o.at!=null?o.at:null;
    P.real=true;audio.src=P.src;plMsg("正在缓冲…");
    if(ft)plMsg(pl.user?"只拿到 30 秒试听：这个网易云账号可能不是会员，或者登录过期了。":"只能试听 30 秒：在「我的」里登录网易云会员后可以听完整版。","warn");
    try{await audio.play();}
    catch(e){if(tok===P.tok&&e.name==="NotAllowedError")plMsg("点 ▶ 开始播放");}
  }catch(e){if(tok===P.tok){plMsg(plErrText(e),"err");plRenderBar();}}
}
const plExpired=()=>Date.now()-P.urlAt>18*60*1000;   // 网易云的播放地址 20 分钟后失效
function curMs(){return audio.currentTime*1000+P.off;}
function lineAt(sid,ms){const L=DATA.lines[sid]||[];let i=-1;for(let j=0;j<L.length;j++){const t=L[j][3];if(t==null)continue;if(t<=ms+150)i=j;else break;}return i;}
function lineSpan(sid,li){   // 这句的起止：到下一句开始为止，最长 12 秒（避免把间奏也循环进去）
  const L=DATA.lines[sid]||[], a=L[li][3];let b=null;
  for(let j=li+1;j<L.length;j++)if(L[j][3]!=null&&L[j][3]>a){b=L[j][3];break;}
  if(b==null)b=isFinite(audio.duration)?audio.duration*1000+P.off:a+8000;
  return [a,Math.min(b,a+12000)];
}
function timedNeighbor(sid,li,dir){const L=DATA.lines[sid]||[];for(let j=li+dir;j>=0&&j<L.length;j+=dir)if(L[j][3]!=null)return j;return -1;}
function seekMs(ms){
  if(P.end&&ms>=P.end){plMsg("试听片段里没有这一句（只有 30 秒）。","warn");return false;}
  audio.currentTime=Math.max(0,(ms-P.off)/1000);return true;
}
function plGoLine(li){
  if(!P.real||li<0)return;
  if(!seekMs(DATA.lines[P.sid][li][3]))return;
  P.li=li;plRenderLine();plMarkLyrics(true);
  if(audio.paused)audio.play().catch(()=>{});
}
function plPlayAt(sid,t){
  if(P.sid===sid&&P.real){
    if(plExpired()){plPlay(sid,{at:t,keepLoop:true});return;}
    const li=lineAt(sid,t);if(li>=0)plGoLine(li);else{seekMs(t);if(audio.paused)audio.play().catch(()=>{});}
    return;
  }
  plPlay(sid,{at:t,queue:albumQueue(songById[sid].album)});
}
function plToggle(){
  if(!P.sid)return;
  if(!P.real){plPlay(P.sid,{keepLoop:true});return;}   // 上次没拿到地址：重试
  if(!audio.paused){audio.pause();return;}
  if(plExpired()){plPlay(P.sid,{at:P.ended?0:curMs(),keepLoop:true});return;}
  if(P.ended){P.ended=false;audio.currentTime=0;}
  audio.play().catch(e=>plMsg("播放不了："+e.message,"err"));
}
function plNextSong(){if(P.qi+1<P.q.length)plPlay(P.q[P.qi+1],{queue:P.q});}
function plPrevSong(){if(P.real&&audio.currentTime>3){audio.currentTime=0;return;}if(P.qi>0)plPlay(P.q[P.qi-1],{queue:P.q});}
function plStop(){
  P.tok++;P.sid=null;P.real=false;P.loop=false;P.li=-1;
  audio.pause();audio.removeAttribute("src");audio.load();
  pbar.hidden=true;document.body.classList.remove("pb");plMarkRows();plMarkLyrics(false);mediaMeta();
}
// 同步：播放时每帧检查一次（后台标签页里靠 timeupdate）
function plTick(){
  if(!P.sid||!P.real)return;
  const ms=curMs();
  if(P.loop&&P.li>=0){const [a,b]=lineSpan(P.sid,P.li);if(!audio.paused&&(ms>=b-60||ms<a-800))seekMs(a);}
  else{const li=lineAt(P.sid,ms);if(li!==P.li){P.li=li;plRenderLine();plMarkLyrics(true);}}
  plRenderTime();
}
let plRaf=0;
function plFrame(){plTick();plRaf=audio.paused?0:requestAnimationFrame(plFrame);}
audio.addEventListener("play",()=>{if(!P.real)return;if(!plRaf)plRaf=requestAnimationFrame(plFrame);plRenderBar();mediaState();});
audio.addEventListener("playing",()=>{if(!P.real)return;P.retried=false;if(P.msgKind==="info")plMsg("");});
audio.addEventListener("pause",()=>{if(!P.real)return;plRenderBar();mediaState();});
audio.addEventListener("timeupdate",plTick);
audio.addEventListener("loadedmetadata",()=>{
  if(!P.real)return;
  if(P.seekTo!=null){const ms=P.seekTo;P.seekTo=null;seekMs(ms);P.li=lineAt(P.sid,ms);plRenderLine();plMarkLyrics(true);}
  plRenderTime(true);
});
audio.addEventListener("ended",()=>{
  if(!P.real)return;
  if(P.loop&&P.li>=0){seekMs(lineSpan(P.sid,P.li)[0]);audio.play().catch(()=>{});return;}
  if(P.qi+1<P.q.length)plNextSong();else{P.ended=true;plRenderBar();}
});
audio.addEventListener("error",()=>{
  if(!P.real||!P.sid)return;
  if(!P.retried){plPlay(P.sid,{at:curMs(),retry:true,keepLoop:true,queue:P.q});return;}   // 地址过期之类：重新拿一次
  P.real=false;plMsg("播放出错了，可能是网络问题。点 ▶ 重试。","err");plRenderBar();
});

// ---------- 播放条 ----------
function plRenderBar(){
  const s=songById[P.sid];if(!s)return;
  const a=albumById[s.album];
  document.getElementById("pbName").textContent=songTitle(s)+" · "+bandById[a.artist].ja+(P.q.length>1?" · "+(P.qi+1)+"/"+P.q.length:"");
  const cv=document.getElementById("pbCover");cv.hidden=!a.cover;if(a.cover&&cv.getAttribute("src")!==a.cover)cv.src=a.cover;
  const playing=P.real&&!audio.paused, pb=document.getElementById("pbPlay");
  pb.innerHTML=playing?PICON.pause:PICON.play;pb.setAttribute("aria-label",playing?"暂停":"播放");
  document.getElementById("pbNext").disabled=P.qi+1>=P.q.length;
  document.getElementById("pbLoop").setAttribute("aria-pressed",String(P.loop));
  plRenderLine();plRenderTime(true);
}
function plRenderLine(){
  const box=document.getElementById("pbLine"), zh=document.getElementById("pbZh"), s=songById[P.sid];
  box.innerHTML="";zh.textContent="";
  if(!s)return;
  const L=DATA.lines[P.sid]||[], li=P.li;
  if(li<0||!L[li]){box.textContent="♪";zh.textContent=s.zh;return;}
  const [,z,segs]=L[li];let pos=0;
  segs.forEach(seg=>seg.forEach(tok=>{
    const x=tokParts(tok), a=pos, b=pos+x.s.length;pos=b;
    let node=rubyNodes(x.s,KANJI.test(x.s)?x.k:null);
    if(x.p){const w=el("span","tk");w.appendChild(node);w.onclick=e=>{e.stopPropagation();openTokPop(P.sid,li,a,b,x);};node=w;}
    box.appendChild(node);
  }));
  zh.textContent=z||"";
}
let plLastQ=-1;
function plRenderTime(force){
  const d=audio.duration, c=audio.currentTime, q=Math.floor(c*4);
  if(!force&&q===plLastQ)return;plLastQ=q;
  const sk=document.getElementById("pbSeek");
  if(!sk._drag){sk.max=isFinite(d)?d:0;sk.value=c;}
  const f=x=>{x=Math.max(0,Math.floor(x));return Math.floor(x/60)+":"+String(x%60).padStart(2,"0");};
  document.getElementById("pbTime").textContent=P.real&&isFinite(d)&&d>0?f(sk._drag?+sk.value:c)+" / "+f(d):"";
}
function plMarkRows(){document.querySelectorAll(".row.song").forEach(r=>r.classList.toggle("playing",r.dataset.sid===P.sid));}
let plUserScroll=0;
["wheel","touchmove"].forEach(ev=>addEventListener(ev,()=>plUserScroll=Date.now(),{passive:true}));
function plMarkLyrics(scroll){
  document.querySelectorAll(".ll.cur").forEach(n=>n.classList.remove("cur"));
  if(!P.sid||P.li<0)return;
  const n=document.querySelector(`.ll[data-sid="${P.sid}"][data-li="${P.li}"]`);if(!n)return;
  n.classList.add("cur");
  if(scroll&&pl.follow&&n.offsetParent&&Date.now()-plUserScroll>4000&&document.getElementById("sheet").hidden&&pop.hidden)
    n.scrollIntoView({block:"center",behavior:"smooth"});
}
// 点播放条上的歌名：打开这首歌的歌词对照，滚到正在唱的那句
function plOpenLyrics(){
  const s=songById[P.sid];if(!s)return;
  closePop();if(!document.getElementById("sheet").hidden)openSheet(false);
  ui.view="songs";saveUI();st.q="";document.getElementById("q").value="";
  if(st.album!==s.album){st.album=s.album;try{history.pushState({album:s.album},"");}catch(e){}}
  render();
  const row=document.querySelector(`.row.song[data-sid="${s.id}"]`);if(!row)return;
  row._openLyrics();plMarkLyrics(false);plUserScroll=0;
  const n=P.li>=0&&row.querySelector(`.ll[data-li="${P.li}"]`);
  (n||row).scrollIntoView({block:n?"center":"start"});
}
document.getElementById("pbPlay").onclick=plToggle;
document.getElementById("pbTitle").onclick=plOpenLyrics;
document.getElementById("pbCover").onclick=plOpenLyrics;
document.getElementById("pbCover").onerror=e=>{e.target.hidden=true;};
document.getElementById("pbNext").onclick=plNextSong;
document.getElementById("pbClose").onclick=plStop;
// 再听这句：回到这句开头；这句刚开始（1.2 秒内）时回到上一句
document.getElementById("pbPrevL").onclick=()=>{
  if(!P.real)return;
  const ms=curMs();let li=P.li>=0?P.li:lineAt(P.sid,ms);
  if(li<0){audio.currentTime=0;if(audio.paused)audio.play().catch(()=>{});return;}
  if(!P.loop&&ms-DATA.lines[P.sid][li][3]<1200){const p=timedNeighbor(P.sid,li,-1);if(p>=0)li=p;}
  plGoLine(li);
};
document.getElementById("pbNextL").onclick=()=>{if(!P.real)return;const li=timedNeighbor(P.sid,P.li>=0?P.li:lineAt(P.sid,curMs()),1);if(li>=0)plGoLine(li);};
document.getElementById("pbLoop").onclick=()=>{
  P.loop=!P.loop;if(P.loop&&P.li<0&&P.real)P.li=lineAt(P.sid,curMs());
  plRenderBar();toast(P.loop?"单句循环：一直重复正在唱的这句":"已关闭单句循环");
};
const pbSeek=document.getElementById("pbSeek");
let seekT=0;
pbSeek.addEventListener("pointerdown",()=>{pbSeek._drag=true;});
pbSeek.addEventListener("pointerup",()=>{clearTimeout(seekT);seekT=setTimeout(()=>{pbSeek._drag=false;},400);});
pbSeek.addEventListener("input",()=>{pbSeek._drag=true;plRenderTime(true);});
pbSeek.addEventListener("change",()=>{
  pbSeek._drag=false;if(!P.real)return;
  audio.currentTime=+pbSeek.value;P.li=lineAt(P.sid,curMs());plRenderLine();plMarkLyrics(false);
});
// 锁屏 / 耳机上的播放控制
function mediaMeta(){
  if(!("mediaSession" in navigator))return;
  const s=songById[P.sid];if(!s){navigator.mediaSession.metadata=null;return;}
  const a=albumById[s.album];
  try{navigator.mediaSession.metadata=new MediaMetadata({title:s.ja,artist:bandById[a.artist].ja,album:a.ja,
    artwork:a.cover?[{src:new URL(a.cover,location.href).href}]:[]});}catch(e){}
}
function mediaState(){if("mediaSession" in navigator)navigator.mediaSession.playbackState=P.real&&!audio.paused?"playing":"paused";}
if("mediaSession" in navigator)[["play",()=>{if(audio.paused)plToggle();}],["pause",()=>audio.pause()],["nexttrack",plNextSong],["previoustrack",plPrevSong],
  ["seekto",d=>{if(P.real&&d.seekTime!=null)audio.currentTime=d.seekTime;}]].forEach(([k,f])=>{try{navigator.mediaSession.setActionHandler(k,f);}catch(e){}});

// ================= 深色 / 浅色 =================
const THEMES=[{id:"system",label:"跟随系统",icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>'},
  {id:"light",label:"浅色",icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'},
  {id:"dark",label:"深色",icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>'}];
function applyTheme(){
  const t=THEMES.find(x=>x.id===ui.theme)||THEMES[0], root=document.documentElement;
  if(t.id==="system")root.removeAttribute("data-theme");
  else root.setAttribute("data-theme",t.id);
  const b=document.getElementById("themeBtn");b.innerHTML=t.icon;
  b.title=b.ariaLabel="外观："+t.label+"（点击切换）";b.setAttribute("aria-label",b.title);
}
document.getElementById("themeBtn").onclick=()=>{const i=THEMES.findIndex(x=>x.id===ui.theme);ui.theme=THEMES[(i+1)%THEMES.length].id;saveUI();applyTheme();toast("外观："+THEMES.find(x=>x.id===ui.theme).label);};

// ================= 页脚 =================
function renderFooter(){
  const f=document.getElementById("foot");f.innerHTML="";
  const bands=ARTISTS.slice(1).map(b=>{const n=DATA.albums.filter(a=>a.artist===b.id).length;return b.label+(n?" "+n+" 张专辑":" 待收录");}).join(" · ");
  f.appendChild(el("p",null,`已收录：${bands} · ${DATA.songs.length} 首歌 · ${DATA.vocab.length} 个词 · ${DATA.grammar.length} 个语法点`));
  f.appendChild(el("p",null,"词表按「出现在几首歌里」排序，再按总次数排序；只收录出现在 2 首及以上歌里的词，同一首歌的不同版本只算一次。例句取自歌词，点歌词里的任何一个词都能查它的意思或词性。"));
  f.appendChild(el("p",null,"复习用间隔重复：记得的词间隔 1、2、4、7、15 天再出现，连续记得到 15 天间隔就算作已掌握。分词、假名注音、罗马音由程序生成，语法计数按分词结果匹配，个别地方可能有误。歌名的中文译名取自 QQ 音乐和网易云音乐。"));
  if(SITE.repo_url){const p=el("p");const a=el("a",null,"GitHub 仓库");a.href=SITE.repo_url;a.target="_blank";a.rel="noopener";p.append("数据和代码：",a);f.appendChild(p);}
}

// ================= 主流程 =================
function renderView(){if(ui.view==="flash")renderFlash();if(ui.view==="list")renderList();if(ui.view==="gram")renderGram();if(ui.view==="graph")renderGraph();if(ui.view==="songs")renderSongs();}
function render(){
  renderFilters();
  ["flash","list","gram","graph","songs"].forEach(v=>document.getElementById("v-"+v).hidden=(ui.view!==v));
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.dataset.v===ui.view));
  renderView();
  if(!document.getElementById("sheet").hidden)renderStats();
}
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{ui.view=t.dataset.v;saveUI();closePop();render();window.scrollTo(0,0);});
document.getElementById("ftoggle").onclick=()=>{ui.filtersOpen=!ui.filtersOpen;saveUI();renderFilters();};
const card=document.getElementById("card");
let swiped=false,tx=0,ty=0;
card.addEventListener("touchstart",e=>{const t=e.changedTouches[0];tx=t.clientX;ty=t.clientY;swiped=false;},{passive:true});
card.addEventListener("touchend",e=>{const t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;
  if(ui.fmode==="browse"&&Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5){swiped=true;step(dx<0?1:-1);}},{passive:true});
function flip(){card.classList.toggle("flipped");const c=document.getElementById("reviewCtl");if(c._sync)c._sync();}
card.onclick=()=>{if(swiped){swiped=false;return;}flip();};
card.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();flip();}};
document.getElementById("prev").onclick=()=>step(-1);
document.getElementById("next").onclick=()=>step(1);
document.getElementById("learn").onclick=()=>{const l=currentList();if(l[st.idx])toggleLearned(l[st.idx].w);};
document.getElementById("shuffle").onclick=()=>{st.order=shuffle(filteredVocab().map(v=>v.w));st.idx=0;renderBrowse();};
document.getElementById("resetorder").onclick=()=>{st.order=null;st.idx=0;renderBrowse();};
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){if(!pop.hidden){closePop();return;}if(!document.getElementById("sheet").hidden){openSheet(false);return;}}
  if(ui.view!=="flash"||/INPUT|TEXTAREA/.test(document.activeElement.tagName)||!document.getElementById("sheet").hidden||pbar.contains(document.activeElement))return;
  if(ui.fmode==="quiz"){if(/^[1-4]$/.test(e.key))answer(+e.key-1);if(e.key==="Enter"&&st.qz&&st.qz.pick!==null){e.preventDefault();st.qz=null;renderQuiz();}return;}
  if(e.key===" "){e.preventDefault();flip();}
  if(ui.fmode==="browse"){if(e.key==="ArrowRight")step(1);if(e.key==="ArrowLeft")step(-1);}
  if(ui.fmode==="review"&&card.classList.contains("flipped")&&/^[123]$/.test(e.key))grade(+e.key-1);
});
applyTheme();applyDisplay();renderAccount();renderFooter();render();
if(CLOUD==="supabase")initSupabase();
</script>
