<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>夜の言葉</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f3ec;--card:#fff;--ink:#241f1a;--muted:#7a7368;--accent:#8a6d3b;--soft:#efe6d2;--border:#e0dacb;--rt:#8c8171;
--c0:#4a6fa5;--c1:#b5655a;--c2:#5f8a4e;--c3:#8a5fa0;--c4:#b0802f;--c5:#3f8f93;--c6:#a8577e;--c7:#6b6f7c;--ok:#4a9d6f;--mark:#f3dc9a;
--jp:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;--nav-h:58px;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#12172b;--card:#1c2340;--ink:#e8e6f0;--muted:#8b92b8;--accent:#d4b876;--soft:#262e52;--border:#2a3155;--rt:#9aa0c2;--c0:#7fa3d9;--c1:#e0928a;--c2:#94c084;--c3:#bf97d6;--c4:#e0b466;--c5:#79c4c7;--c6:#df8fb6;--c7:#a4a9b8;--ok:#6cc596;--mark:#6b5a2a;}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#12172b;--card:#1c2340;--ink:#e8e6f0;--muted:#8b92b8;--accent:#d4b876;--soft:#262e52;--border:#2a3155;--rt:#9aa0c2;--c0:#7fa3d9;--c1:#e0928a;--c2:#94c084;--c3:#bf97d6;--c4:#e0b466;--c5:#79c4c7;--c6:#df8fb6;--c7:#a4a9b8;--ok:#6cc596;--mark:#6b5a2a;}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;-webkit-text-size-adjust:100%;}
[hidden]{display:none!important;}
button{font:inherit;color:inherit;}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:20px 40px;}

/* ---------- header ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;}
.logo{font-family:var(--jp);font-size:1.6rem;font-weight:700;letter-spacing:.06em;line-height:1.2;}
.tagline{color:var(--muted);font-size:.8rem;margin-top:2px;}
.acct{display:flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--card);border-radius:999px;padding:4px 12px 4px 4px;cursor:pointer;font-size:.8rem;max-width:52%;}
.acct img{width:26px;height:26px;border-radius:50%;flex:none;}
.acct .ph{width:26px;height:26px;border-radius:50%;flex:none;background:var(--soft);display:grid;place-items:center;font-size:.8rem;color:var(--accent);}
.acct .an{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none;}
.dot.on{background:var(--ok);}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:6px;margin-bottom:12px;}
.tab{flex:1;padding:9px 4px;border-radius:10px;border:1px solid var(--border);background:var(--card);font-size:.92rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;}
.tab .ic{font-family:var(--jp);font-weight:700;opacity:.8;}
.tab.active{background:var(--accent);color:var(--card);border-color:var(--accent);}

/* ---------- filters ---------- */
.filters{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:14px;}
.fhead{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;background:none;border:0;cursor:pointer;text-align:left;}
.ftitle{font-weight:600;font-size:.85rem;flex:none;}
.fsum{flex:1;min-width:0;font-size:.78rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.chev{flex:none;width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:-4px 4px 0;transition:transform .2s;}
.filters.open .chev{transform:rotate(-135deg);margin-top:4px;}
.fbody{padding:0 12px 10px;border-top:1px dashed var(--border);}
.frow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:8px 0 0;}
.flabel{font-size:.75rem;color:var(--muted);width:100%;}
.chip{border:1px solid var(--border);background:transparent;padding:5px 11px;border-radius:999px;font-size:.8rem;cursor:pointer;}
.chip.on{background:var(--soft);border-color:var(--accent);font-weight:600;}
.chip:disabled{opacity:.4;cursor:not-allowed;}
.stat{font-size:.76rem;color:var(--muted);padding:0 12px 10px;}

/* ---------- common ---------- */
.badge{display:inline-flex;align-items:center;font-size:.72rem;padding:2px 8px;border-radius:999px;border:1px solid;white-space:nowrap;}
.bw{color:var(--muted);border-color:var(--border);}
.bw.learned{color:var(--ok);border-color:var(--ok);}
.tier{font-size:.72rem;padding:2px 9px;border-radius:999px;background:var(--soft);color:var(--accent);}
.tags{display:flex;flex-wrap:wrap;gap:5px;}
.empty{color:var(--muted);text-align:center;padding:30px 0;font-size:.9rem;}
.btn{border:1px solid var(--border);background:var(--card);padding:9px 14px;border-radius:10px;cursor:pointer;font-size:.9rem;}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--card);}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px;}

/* 假名网格：每个音节上面是假名、下面是罗马音 */
.kg{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:2px 4px;}
.kc{display:flex;flex-direction:column;align-items:center;min-width:1.5em;}
.kc .kk{font-size:1rem;color:var(--muted);}
.kc .kr{font-size:.78rem;color:var(--accent);}
.kgsep{color:var(--muted);padding:0 6px;align-self:center;}
.syl{color:var(--accent);font-size:.8rem;letter-spacing:.02em;}

/* 歌词行：分段排列，汉字上注假名，每段下面是罗马音 */
.ll{padding:8px 0 8px 10px;border-left:2px solid var(--soft);}
.ll+.ll{margin-top:6px;}
.lj{display:flex;flex-wrap:wrap;align-items:flex-end;column-gap:.45em;row-gap:6px;}
.seg{display:inline-flex;flex-direction:column;align-items:flex-start;}
.sj{font-family:var(--jp);font-size:1.02rem;line-height:1.25;white-space:nowrap;}
.sr{font-size:.72rem;color:var(--muted);line-height:1.3;white-space:nowrap;}
.sr.hit{color:var(--accent);font-weight:600;}
.seg.gap{width:.6em;}
ruby{ruby-position:over;ruby-align:center;}
rt{font-size:.55em;color:var(--rt);font-family:-apple-system,"PingFang SC",sans-serif;letter-spacing:0;}
.lz{color:var(--muted);font-size:.8rem;margin-top:4px;line-height:1.5;}
.no-rt rt{visibility:hidden;}
.no-ro .sr{display:none;}
.no-zh .lz{display:none;}
.no-ro .lj{column-gap:.2em;}
.src{font-size:.78rem;color:var(--muted);margin-top:6px;}
.src b{color:var(--ink);font-weight:600;}

/* 展开的"出现在哪些歌" */
details.occ{width:100%;text-align:left;font-size:.85rem;margin-top:4px;}
details.occ>summary{cursor:pointer;color:var(--accent);padding:6px 0;list-style-position:inside;}
.ctxsong{padding:10px 0 12px;border-top:1px dashed var(--border);}
.ctxhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px;}
.ctxt{font-family:var(--jp);font-size:1.05rem;font-weight:700;}
.ctxa{font-size:.82rem;color:var(--muted);margin-top:1px;}
.gcount{font-size:.78rem;color:var(--muted);white-space:nowrap;}

/* ---------- flashcards ---------- */
.stage{perspective:1400px;margin-bottom:12px;touch-action:pan-y;}
.card{display:grid;cursor:pointer;transform-style:preserve-3d;transition:transform .45s;}
.card.flipped{transform:rotateY(180deg);}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid var(--border);border-radius:16px;background:var(--card);padding:22px 18px;min-height:320px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;}
.back{transform:rotateY(180deg);justify-content:flex-start;}
.bigword{font-family:var(--jp);font-size:2.4rem;font-weight:700;line-height:1.25;text-wrap:balance;}
.hint{font-size:.78rem;color:var(--muted);}
.meaning{font-size:1.35rem;font-weight:600;text-wrap:balance;}
.wordline{font-family:var(--jp);font-size:1.05rem;}
.exbox{background:var(--soft);border-radius:12px;padding:10px 12px 12px;width:100%;text-align:left;}
.exbox .ll{border-left:0;padding-left:0;}
.exlabel{font-size:.72rem;color:var(--muted);letter-spacing:.08em;margin-bottom:2px;}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.prog{color:var(--muted);font-size:.84rem;font-variant-numeric:tabular-nums;}
.learn{margin-top:10px;width:100%;padding:11px;border-radius:10px;border:1px solid var(--accent);background:var(--soft);cursor:pointer;font-size:.92rem;}
.learn.on{background:var(--accent);color:var(--card);}
.tools{display:flex;gap:8px;margin-top:8px;}
.tools .btn{flex:1;font-size:.84rem;padding:8px;}

/* ---------- list / grammar ---------- */
.group{font-size:.82rem;color:var(--muted);margin:18px 0 4px;font-weight:600;}
.row{border-bottom:1px solid var(--border);}
.rowhead{display:flex;align-items:center;gap:10px;padding:11px 2px;cursor:pointer;}
.rowhead input{width:20px;height:20px;flex:none;accent-color:var(--accent);}
.rw{font-family:var(--jp);font-size:1.15rem;font-weight:700;min-width:6em;max-width:45%;}
.rw .syl{display:block;font-family:-apple-system,"PingFang SC",sans-serif;font-weight:400;}
.rm{flex:1;font-size:.9rem;min-width:0;}
.rc{font-size:.75rem;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;}
.rowbody{display:none;padding:0 4px 14px 32px;}
.row.open .rowbody{display:flex;flex-direction:column;gap:10px;}
.gram .rowbody{padding-left:4px;}
.done .rw,.done .rm{opacity:.5;}
.sub{color:var(--muted);font-size:.8rem;line-height:1.5;margin:0 0 6px;}

/* ---------- songs ---------- */
.album{background:var(--card);border:1px solid var(--border);border-radius:14px;margin-bottom:12px;overflow:hidden;}
.ahead{display:flex;gap:14px;align-items:center;width:100%;padding:12px;background:none;border:0;cursor:pointer;text-align:left;}
.cover{width:76px;height:76px;border-radius:8px;flex:none;object-fit:cover;background:var(--soft);display:grid;place-items:center;font-family:var(--jp);font-weight:700;color:var(--accent);font-size:1rem;text-align:center;padding:4px;}
.ainfo{flex:1;min-width:0;}
.at{font-family:var(--jp);font-size:1.12rem;font-weight:700;line-height:1.35;}
.az{font-size:.82rem;color:var(--muted);}
.am{font-size:.76rem;color:var(--muted);margin-top:4px;line-height:1.5;}
.abody{padding:0 12px 6px;border-top:1px dashed var(--border);}
.album:not(.open) .abody{display:none;}
.album .chev{align-self:center;}
.album.open .chev{transform:rotate(-135deg);margin-top:4px;}
.song .rw{min-width:0;max-width:none;flex:1;}
.song .rw .sz{display:block;font-family:-apple-system,"PingFang SC",sans-serif;font-weight:400;font-size:.8rem;color:var(--muted);}
.song .rowbody{padding-left:2px;}
details.lyr>summary{cursor:pointer;color:var(--accent);padding:6px 0;font-size:.85rem;}
.lyrics .ll{margin-top:10px;}
.dupnote{font-size:.76rem;color:var(--muted);}
.pending{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:12px;margin-top:8px;}
.pend{display:flex;flex-direction:column;gap:4px;font-size:.75rem;color:var(--muted);text-align:center;}
.pend .cover{width:100%;height:auto;aspect-ratio:1;max-width:100%;opacity:.55;filter:grayscale(.5);}
.h2{font-size:.85rem;font-weight:600;color:var(--muted);margin:22px 0 4px;}

/* ---------- settings sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,12,20,.4);z-index:20;}
.sheet{position:fixed;z-index:21;left:50%;bottom:0;transform:translateX(-50%);width:min(560px,100%);max-height:88vh;overflow:auto;background:var(--card);border:1px solid var(--border);border-radius:16px 16px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));}
.sheet h3{margin:0 0 10px;font-size:1rem;}
.sheet section{padding:12px 0;border-top:1px solid var(--border);}
.sheet section:first-of-type{border-top:0;padding-top:0;}
.sheet p{font-size:.84rem;color:var(--muted);line-height:1.6;margin:0 0 8px;}
.who{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.who img{width:36px;height:36px;border-radius:50%;}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;font-size:.9rem;}
.toggle input{width:20px;height:20px;accent-color:var(--accent);}
.sheet textarea{width:100%;min-height:84px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--ink);padding:8px;font:inherit;font-size:.78rem;}
.srow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
.msg{font-size:.8rem;color:var(--ok);margin-top:6px;min-height:1em;}
.close{position:absolute;right:12px;top:10px;border:0;background:none;font-size:1.4rem;cursor:pointer;color:var(--muted);padding:4px 8px;}
.sheet a{color:var(--accent);}

/* ---------- footer ---------- */
footer{margin-top:36px;padding-top:14px;border-top:1px solid var(--border);color:var(--muted);font-size:.78rem;line-height:1.7;}
footer p{margin:0 0 6px;}
footer a{color:var(--accent);}

/* ---------- 手机：底部导航 ---------- */
@media (max-width:640px){
  .wrap{padding-block:14px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px));}
  .logo{font-size:1.35rem;}
  .tabs{position:fixed;z-index:10;left:0;right:0;bottom:0;margin:0;gap:0;background:var(--card);border-top:1px solid var(--border);padding:4px 6px calc(4px + env(safe-area-inset-bottom,0px));}
  .tab{flex-direction:column;gap:1px;border:0;border-radius:10px;padding:6px 2px;font-size:.72rem;background:none;color:var(--muted);}
  .tab .ic{font-size:1.1rem;opacity:1;}
  .tab.active{background:none;color:var(--accent);}
  .face{min-height:300px;padding:18px 14px;}
  .bigword{font-size:2.1rem;}
  .rowbody{padding-left:4px;}
  .rw{min-width:5em;}
  .cover{width:64px;height:64px;}
}
@media (prefers-reduced-motion:reduce){.card,.chev{transition:none;}}
</style>
</head>
<body>
<div class="wrap" id="app">
  <header class="top">
    <div>
      <div class="logo">夜の言葉</div>
      <div class="tagline">ヨルシカ × あたらよ · 听歌学日语</div>
    </div>
    <button class="acct" id="acct" type="button" aria-label="账号与设置"><span class="ph">⚙</span><span class="an">设置</span></button>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab active" data-v="flash" type="button"><span class="ic">札</span><span>闪卡</span></button>
    <button class="tab" data-v="list" type="button"><span class="ic">語</span><span>词表</span></button>
    <button class="tab" data-v="gram" type="button"><span class="ic">文</span><span>语法</span></button>
    <button class="tab" data-v="songs" type="button"><span class="ic">歌</span><span>歌曲</span></button>
  </nav>

  <section class="filters" id="filters">
    <button class="fhead" id="ftoggle" type="button" aria-expanded="false" aria-controls="fbody">
      <span class="ftitle">筛选</span><span class="fsum" id="fsum"></span><span class="chev"></span>
    </button>
    <div class="fbody" id="fbody" hidden>
      <div class="frow"><span class="flabel">乐队</span><div id="fArtist" class="tags"></div></div>
      <div class="frow"><span class="flabel">专辑（可多选）</span><div id="fAlbum" class="tags"></div></div>
      <div class="frow" id="fTierRow"><span class="flabel">频率</span><div id="fTier" class="tags"></div></div>
      <div class="frow" id="fStateRow"><span class="flabel">状态</span><div id="fState" class="tags"></div></div>
    </div>
    <div class="stat" id="stat"></div>
  </section>

  <main>
    <div id="v-flash">
      <div class="stage"><div class="card" id="card" role="button" tabindex="0" aria-label="闪卡，点击翻面">
        <div class="face front" id="front"></div>
        <div class="face back" id="back"></div>
      </div></div>
      <div class="nav">
        <button class="btn" id="prev" type="button">← 上一个</button>
        <span class="prog" id="prog"></span>
        <button class="btn" id="next" type="button">下一个 →</button>
      </div>
      <button class="learn" id="learn" type="button">标记为已掌握</button>
      <div class="tools"><button class="btn" id="shuffle" type="button">随机打乱</button><button class="btn" id="resetorder" type="button">恢复频率顺序</button></div>
    </div>
    <div id="v-list" hidden></div>
    <div id="v-gram" class="gram" hidden></div>
    <div id="v-songs" hidden></div>
  </main>

  <footer id="foot"></footer>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <button class="close" id="sheetClose" type="button" aria-label="关闭">×</button>
  <section>
    <h3 id="sheetTitle">账号与同步</h3>
    <div class="who" id="who"></div>
    <p id="syncText"></p>
  </section>
  <section>
    <h3>显示</h3>
    <label class="toggle">汉字上注假名 <input type="checkbox" id="optRt"></label>
    <label class="toggle">歌词下标罗马音 <input type="checkbox" id="optRo"></label>
    <label class="toggle">显示中文翻译 <input type="checkbox" id="optZh"></label>
  </section>
  <section>
    <h3>备份进度</h3>
    <p>把已掌握的词复制出来，粘贴到另一台设备或另一个网址（比如 GitHub 版和 claude.ai 版之间）导入。导入是合并，不会删掉已有的记录。</p>
    <textarea id="io" spellcheck="false" aria-label="进度数据"></textarea>
    <div class="srow">
      <button class="btn" id="exportBtn" type="button">复制我的进度</button>
      <button class="btn primary" id="importBtn" type="button">导入上面的进度</button>
    </div>
    <div class="msg" id="ioMsg" role="status"></div>
  </section>
</div>

<script>
const DATA = __DATA__;
const SITE = __SITE__;

// ---------- 基础数据 ----------
const albumById=Object.fromEntries(DATA.albums.map(a=>[a.id,a]));
const albumColor=Object.fromEntries(DATA.albums.map((a,i)=>[a.id,"var(--c"+(i%8)+")"]));
const songById=Object.fromEntries(DATA.songs.map(s=>[s.id,s]));
const bandById=Object.fromEntries(DATA.bands.map(b=>[b.id,b]));
const ARTISTS=[{id:"all",label:"全部"}].concat(DATA.bands.slice().sort((a,b)=>a.id==="yorushika"?-1:1).map(b=>({id:b.id,label:b.ja})));
const TIERS=[{id:"all",label:"全部"},{id:"core",label:"核心",min:10},{id:"high",label:"高频",min:6},{id:"mid",label:"中频",min:3},{id:"base",label:"基础",min:2}];
const TIERNAME={core:"核心",high:"高频",mid:"中频",base:"基础"};

// ---------- 本机存储（per-viewer 便利项） ----------
const LS="yorushika_learned_v1", LS_UI="yoru_ui_v1", LS_SYNC="yoru_synced_v1";
function lsGet(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
const ui=Object.assign({view:"flash",filtersOpen:false,rt:true,ro:true,zh:true,openAlbums:null},lsGet(LS_UI,{}));
function saveUI(){lsSet(LS_UI,ui);}
const st={artist:"all",albums:new Set(),tier:"all",state:"all",idx:0,order:null};
let learned=lsGet(LS,{});

// ---------- 云端同步（在 claude.ai 打开时可用） ----------
let cloudDoc=null, account=null, syncState="local", writing=Promise.resolve(), pendingWrite=null;
function learnedWords(){return Object.keys(learned).filter(w=>learned[w]).sort();}
function setSync(s){syncState=s;renderAccount();}
async function initCloud(){
  const c=window.claude;
  if(!c||typeof c.use!=="function"){if(!initCloud.retried){initCloud.retried=true;setTimeout(initCloud,1500);}setSync("local");return;}
  setSync("connecting");
  try{
    const [user,db]=await Promise.all([c.use("user"),c.use("db")]);
    if(!user||!db){setSync("local");return;}
    const me=await user.me();
    if(!me||!me.id){setSync("signedout");return;}
    account={name:me.name,avatar:me.avatarUrl};
    cloudDoc=db.doc("data/users/"+me.id+"/progress");
    const snap=await cloudDoc.get();
    const remote=snap.exists?((snap.data()||{}).learned||[]):[];
    const syncedBefore=lsGet(LS_SYNC,false);
    // 这台设备以前同步过：以云端为准；第一次登录：把本机进度和云端合并
    const next={};
    if(!syncedBefore) learnedWords().forEach(w=>next[w]=true);
    remote.forEach(w=>next[w]=true);
    const changed=JSON.stringify(Object.keys(next).sort())!==JSON.stringify(learnedWords());
    learned=next; lsSet(LS,learned);
    if(!snap.exists||JSON.stringify(remote.slice().sort())!==JSON.stringify(learnedWords())) await cloudDoc.set({learned:learnedWords()});
    lsSet(LS_SYNC,true);
    setSync("synced");
    if(changed) render();
    cloudDoc.onSnapshot(sn=>{
      if(!sn.exists||sn.metadata.hasPendingWrites) return;
      const words=(sn.data()||{}).learned||[];
      if(JSON.stringify(words.slice().sort())===JSON.stringify(learnedWords())) return;
      learned={}; words.forEach(w=>learned[w]=true); lsSet(LS,learned); render();
    },()=>setSync("error"));
  }catch(e){ setSync(e&&(e.code==="not_granted"||e.code==="permission_denied")?"readonly":"error"); }
}
function queueCloudWrite(){
  if(!cloudDoc||syncState==="readonly") return;
  clearTimeout(pendingWrite);
  pendingWrite=setTimeout(()=>{
    writing=writing.then(()=>cloudDoc.set({learned:learnedWords()}))
      .then(()=>{if(syncState!=="synced")setSync("synced");})
      .catch(e=>setSync(e&&(e.code==="not_granted"||e.code==="permission_denied"||e.code==="invalid_argument")?"readonly":"error"));
  },500);
}
function persist(){lsSet(LS,learned);queueCloudWrite();}

// ---------- 假名 / 罗马音 ----------
const KANJI=/[㐀-鿿々〆ヶ]/;
const toHira=s=>s.replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
const R={あ:"a",い:"i",う:"u",え:"e",お:"o",か:"ka",き:"ki",く:"ku",け:"ke",こ:"ko",さ:"sa",し:"shi",す:"su",せ:"se",そ:"so",た:"ta",ち:"chi",つ:"tsu",て:"te",と:"to",な:"na",に:"ni",ぬ:"nu",ね:"ne",の:"no",は:"ha",ひ:"hi",ふ:"fu",へ:"he",ほ:"ho",ま:"ma",み:"mi",む:"mu",め:"me",も:"mo",や:"ya",ゆ:"yu",よ:"yo",ら:"ra",り:"ri",る:"ru",れ:"re",ろ:"ro",わ:"wa",ゐ:"i",ゑ:"e",を:"wo",ん:"n",が:"ga",ぎ:"gi",ぐ:"gu",げ:"ge",ご:"go",ざ:"za",じ:"ji",ず:"zu",ぜ:"ze",ぞ:"zo",だ:"da",ぢ:"ji",づ:"zu",で:"de",ど:"do",ば:"ba",び:"bi",ぶ:"bu",べ:"be",ぼ:"bo",ぱ:"pa",ぴ:"pi",ぷ:"pu",ぺ:"pe",ぽ:"po",ゔ:"vu",ぁ:"a",ぃ:"i",ぅ:"u",ぇ:"e",ぉ:"o",ゃ:"ya",ゅ:"yu",ょ:"yo",ゎ:"wa"};
const SMALL=/[ゃゅょぁぃぅぇぉゎャュョァィゥェォヮ]/;
const PUNCT={"、":",","。":".","？":"?","！":"!","　":" ","…":"…","〜":"~","ー":"-"};
// 切成音节：拗音(きゃ)、促音(っ)与后一个音节合并，长音(ー)并入前一个音节
function morae(s){const out=[];for(const c of s){const last=out[out.length-1];
  if(last!==undefined&&(SMALL.test(c)||c==="ー")&&!/[っッ]$/.test(last))out[out.length-1]+=c;
  else if(last!==undefined&&/[っッ]$/.test(last))out[out.length-1]+=c;
  else out.push(c);}return out;}
function unitRoma(u){
  const h=toHira(u);
  if(/^っ/.test(h)){const r=unitRoma(h.slice(1));return r?(r.startsWith("ch")?"t"+r:r[0]+r):"";}
  if(h.endsWith("ー")){const r=unitRoma(h.slice(0,-1));const v=(r.match(/[aeiou](?!.*[aeiou])/)||[""])[0];return r+v;}
  const b=h[0], sm=h.slice(1);
  let r=R[b]; if(r===undefined) return PUNCT[b]!==undefined?PUNCT[b]:u;
  if(!sm) return r;
  const sr=R[sm]||"";
  if(/[ゃゅょ]/.test(sm)) return /^(shi|chi|ji)$/.test(r)?r.slice(0,-1)+sr.slice(1):r.slice(0,-1)+sr;
  if(b==="う") return "w"+sr;
  return r.replace(/[aeiou]$/,"")+sr;
}
function romaji(s){const us=morae(s);let out="";us.forEach((u,i)=>{let r=unitRoma(u);
  if(r==="n"&&i+1<us.length){const nx=unitRoma(us[i+1]);if(/^[aeiouy]/.test(nx))r="n'";}out+=r;});return out;}
function sylRoma(k){return k.split(" / ").map(a=>morae(a.replace(/[〜~]/g,"")).map(unitRoma).join("·")).join(" / ");}

// ---------- DOM 小工具 ----------
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;}
function esc(s){return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");}
function rubyEl(base,rt){const r=el("ruby");r.appendChild(document.createTextNode(base));r.appendChild(el("rt",null,rt));return r;}
// 汉字部分注假名，送假名不注：思い出(おもいで) → 思[おも]い出[で]
function rubyNodes(s,k){
  const f=document.createDocumentFragment();
  if(!k||!KANJI.test(s)){f.appendChild(document.createTextNode(s));return f;}
  const runs=s.match(/[㐀-鿿々〆ヶ]+|[^㐀-鿿々〆ヶ]+/g);
  const m=toHira(k).match(new RegExp("^"+runs.map(r=>KANJI.test(r)?"(.+?)":esc(toHira(r))).join("")+"$"));
  if(!m){f.appendChild(rubyEl(s,toHira(k)));return f;}
  let g=1; runs.forEach(r=>f.appendChild(KANJI.test(r)?rubyEl(r,m[g++]):document.createTextNode(r)));
  return f;
}
const KATA_ONLY=/^[゠-ヿ・\s]+$/;
function songTitle(s){return KATA_ONLY.test(s.ja)?s.ja+"（"+s.zh+"）":s.ja;}
function albumBadge(aid){const a=albumById[aid];const b=el("span","badge",a.short||a.ja);b.title=a.ja+" · "+a.zh;b.style.color=b.style.borderColor=albumColor[aid];return b;}
function albumBadges(hits){const box=el("div","tags");const seen=new Set();hits.forEach(([sid])=>{const a=songById[sid].album;if(!seen.has(a)){seen.add(a);box.appendChild(albumBadge(a));}});return box;}
function kanaGrid(k){
  const box=el("div","kg");
  k.split(" / ").forEach((alt,i)=>{if(i)box.appendChild(el("span","kgsep","/"));
    morae(alt.replace(/[〜~]/g,"")).forEach(u=>{const c=el("span","kc");c.append(el("span","kk",u),el("span","kr",unitRoma(u)));box.appendChild(c);});});
  return box;
}

// 一行歌词：分段显示，汉字注假名，段下标罗马音，命中的词高亮
function lyricLine(sid,li,spans){
  const [ja,zh,segs]=DATA.lines[sid][li];
  const box=el("div","ll"), row=el("div","lj");
  let pos=0;
  segs.forEach(seg=>{
    const text=seg.map(t=>typeof t==="string"?t:t[0]).join("");
    if(/^[\s　]+$/.test(text)){row.appendChild(el("span","seg gap"));pos+=text.length;return;}
    const sg=el("span","seg"), top=el("span","sj"); let reading="", hit=false;
    seg.forEach(t=>{
      const s=typeof t==="string"?t:t[0], k=typeof t==="string"?null:t[1];
      const a=pos,b=pos+s.length; pos=b;
      const node=rubyNodes(s,KANJI.test(s)?k:null);
      if(spans&&spans.some(([x,y])=>x<b&&a<y)){hit=true;const m=el("mark");m.appendChild(node);top.appendChild(m);}else top.appendChild(node);
      reading+=toHira(k||s);
    });
    const ro=el("span","sr"+(hit?" hit":""),romaji(reading)||" ");
    sg.append(top,ro); row.appendChild(sg);
  });
  box.appendChild(row);
  if(zh)box.appendChild(el("div","lz",zh));
  return box;
}
function spansAt(item,sid,li){return ((item.loc||{})[sid]||[]).filter(h=>h[0]===li).map(h=>[h[1],h[2]]);}
function exampleBox(item,label){
  if(!item.x)return null;
  const [sid,li]=item.x, s=songById[sid];
  const b=el("div","exbox"); b.appendChild(el("div","exlabel",label||"歌词例句"));
  b.appendChild(lyricLine(sid,li,spansAt(item,sid,li)));
  const src=el("div","src"); src.append("出自 ",el("b",null,"《"+songTitle(s)+"》")," · "+(albumById[s.album].short||albumById[s.album].ja));
  b.appendChild(src); return b;
}
// 展开：每首歌的出现次数 + 全部原句
function occDetails(item,hits,label){
  const d=el("details","occ"); d.appendChild(el("summary",null,label));
  let built=false;
  d.addEventListener("toggle",()=>{if(!d.open||built)return;built=true;
    hits.slice().sort((x,y)=>y[1]-x[1]).forEach(([sid,c])=>{
      const s=songById[sid], a=albumById[s.album], box=el("div","ctxsong");

      head.append(left,el("div","gcount",c+" 次")); box.appendChild(head);
      const byLine=new Map();
      ((item.loc||{})[sid]||[]).forEach(([li,x,y])=>{if(!byLine.has(li))byLine.set(li,[]);byLine.get(li).push([x,y]);});
      [...byLine.keys()].sort((p,q)=>p-q).forEach(li=>box.appendChild(lyricLine(sid,li,byLine.get(li))));
      d.appendChild(box);

  });

  return d;

function scoped(item,ids){const set=new Set(ids);let songs=0,total=0;const hits=[];
  for(const [sid,c] of Object.entries(item.occ)){if(set.has(sid)){songs++;total+=c;hits.push([sid,c]);}}return {songs,total,hits};}
function tierOf(n){return n>=10?"core":n>=6?"high":n>=3?"mid":"base";}
function filteredVocab(){const ids=activeSongIds();
  let list=DATA.vocab.map(v=>{const s=scoped(v,ids);return {...v,...s,tier:tierOf(s.songs)};}).filter(v=>v.songs>=2);

  synced:"已登录，进度自动保存到你的 claude.ai 账号，在任何设备上打开这个页面都能接着学。",
  readonly:"你对这个页面只有查看权限，进度不能保存到云端，只保存在本机。",
  error:"暂时连不上云端，进度先保存在本机，恢复连接后会继续同步。"};
function renderAccount(){
  const b=document.getElementById("acct");b.innerHTML="";
  const synced=syncState==="synced";
  if(account&&account.avatar){const img=el("img");img.src=account.avatar;img.alt="";b.appendChild(img);}else b.appendChild(el("span","ph","⚙"));
  b.appendChild(el("span","dot"+(synced?" on":"")));
  b.appendChild(el("span","an",synced?(account.name||"已同步"):syncState==="connecting"?"连接中":"本机模式"));
  const who=document.getElementById("who");who.innerHTML="";
  if(account){if(account.avatar){const i=el("img");i.src=account.avatar;i.alt="";who.appendChild(i);}who.appendChild(el("b",null,account.name||"已登录"));}
  const p=document.getElementById("syncText");p.textContent=SYNC_TEXT[syncState]||"";
  if(!synced&&SITE.cloud_url&&syncState!=="connecting"&&!window.claude){p.append(" 想登录并云端同步，请打开 ");const a=el("a",null,"claude.ai 版");a.href=SITE.cloud_url;a.target="_blank";a.rel="noopener";p.append(a,"。");}
}
function openSheet(o){document.getElementById("sheet").hidden=!o;document.getElementById("scrim").hidden=!o;if(o){document.getElementById("ioMsg").textContent="";document.getElementById("sheetClose").focus();}}
function applyDisplay(){const r=document.documentElement.classList;r.toggle("no-rt",!ui.rt);r.toggle("no-ro",!ui.ro);r.toggle("no-zh",!ui.zh);
  document.getElementById("optRt").checked=ui.rt;document.getElementById("optRo").checked=ui.ro;document.getElementById("optZh").checked=ui.zh;}
[["optRt","rt"],["optRo","ro"],["optZh","zh"]].forEach(([id,k])=>document.getElementById(id).onchange=e=>{ui[k]=e.target.checked;saveUI();applyDisplay();});
document.getElementById("acct").onclick=()=>openSheet(true);
document.getElementById("sheetClose").onclick=()=>openSheet(false);
document.getElementById("scrim").onclick=()=>openSheet(false);
document.getElementById("exportBtn").onclick=()=>{
  const io=document.getElementById("io"), msg=document.getElementById("ioMsg");
  io.value=JSON.stringify({yoru_no_kotoba:1,learned:learnedWords()});
  const done=()=>{msg.textContent="已复制 "+learnedWords().length+" 个词的进度。";};
  try{navigator.clipboard.writeText(io.value).then(done,()=>{io.select();msg.textContent="已选中，请手动复制。";});}catch(e){io.select();msg.textContent="已选中，请手动复制。";}
};
document.getElementById("importBtn").onclick=()=>{
  const io=document.getElementById("io"), msg=document.getElementById("ioMsg");
  let words=null;
  try{const j=JSON.parse(io.value);words=Array.isArray(j)?j:Array.isArray(j.learned)?j.learned:Object.keys(j).filter(k=>j[k]===true);}catch(e){}
  if(!words){msg.textContent="没认出这段内容。请粘贴「复制我的进度」得到的整段文字。";return;}
  const known=new Set(DATA.vocab.map(v=>v.w)); let n=0;
  words.forEach(w=>{if(typeof w==="string"&&!learned[w]){learned[w]=true;if(known.has(w))n++;}});
  persist();render();msg.textContent="导入完成，新增 "+n+" 个已掌握的词。";
};

// ---------- 页脚 ----------
function renderFooter(){
  const f=document.getElementById("foot");f.innerHTML="";
  const bands=ARTISTS.slice(1).map(b=>{const n=DATA.albums.filter(a=>a.artist===b.id).length;return b.label+(n?" "+n+" 张专辑":" 待收录");}).join(" · ");
  f.appendChild(el("p",null,`已收录：${bands} · ${DATA.songs.length} 首歌 · ${DATA.vocab.length} 个词 · ${DATA.grammar.length} 个语法点`));
  f.appendChild(el("p",null,"词表按「出现在几首歌里」排序，再按总次数排序；只收录出现在 2 首及以上歌里的词，同一首歌的不同版本只算一次。例句取自歌词，展开「出现在哪些歌」可以看全部原句和中文翻译。"));
  f.appendChild(el("p",null,"分词、假名注音和罗马音由程序生成，语法计数按分词结果匹配，个别地方可能有误。"));
  if(SITE.repo_url){const p=el("p");const a=el("a",null,"GitHub 仓库");a.href=SITE.repo_url;a.target="_blank";a.rel="noopener";p.append("数据和代码：",a);f.appendChild(p);}
}

// ---------- 主流程 ----------
function render(){
  renderFilters();
  ["flash","list","gram","songs"].forEach(v=>document.getElementById("v-"+v).hidden=(ui.view!==v));
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.dataset.v===ui.view));
  if(ui.view==="flash")renderFlash();if(ui.view==="list")renderList();if(ui.view==="gram")renderGram();if(ui.view==="songs")renderSongs();
}
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{ui.view=t.dataset.v;saveUI();render();window.scrollTo(0,0);});
document.getElementById("ftoggle").onclick=()=>{ui.filtersOpen=!ui.filtersOpen;saveUI();renderFilters();};
const card=document.getElementById("card");
let swiped=false,tx=0,ty=0;
card.addEventListener("touchstart",e=>{const t=e.changedTouches[0];tx=t.clientX;ty=t.clientY;swiped=false;},{passive:true});
card.addEventListener("touchend",e=>{const t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5){swiped=true;step(dx<0?1:-1);}},{passive:true});
card.onclick=()=>{if(swiped){swiped=false;return;}card.classList.toggle("flipped");};
card.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();card.classList.toggle("flipped");}};
document.getElementById("prev").onclick=()=>step(-1);
document.getElementById("next").onclick=()=>step(1);
document.getElementById("learn").onclick=()=>{const l=currentList();if(l[st.idx])toggleLearned(l[st.idx].w);};
document.getElementById("shuffle").onclick=()=>{const l=filteredVocab().map(v=>v.w);for(let i=l.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[l[i],l[j]]=[l[j],l[i]];}st.order=l;st.idx=0;renderFlash();};
document.getElementById("resetorder").onclick=()=>{st.order=null;st.idx=0;renderFlash();};
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&!document.getElementById("sheet").hidden){openSheet(false);return;}
  if(ui.view!=="flash"||/INPUT|TEXTAREA/.test(document.activeElement.tagName)||!document.getElementById("sheet").hidden)return;
  if(e.key==="ArrowRight")step(1); if(e.key==="ArrowLeft")step(-1);
  if(e.key===" "){e.preventDefault();card.classList.toggle("flipped");}});
applyDisplay();renderAccount();renderFooter();render();initCloud();
</script>
</body>
</html>
